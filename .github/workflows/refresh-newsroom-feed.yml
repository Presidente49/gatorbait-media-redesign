name: Refresh GatorBait publication feeds

on:
  push:
    branches: [main]
    paths:
      - 'automation/update_newsroom_feed.py'
      - 'automation/update_newsroom_feed_routed.py'
      - 'automation/episodes_feed.py'
      - 'automation/florida_stats.py'
      - 'newsroom-preview/editorial-routing.json'
      - '.github/workflows/refresh-newsroom-feed.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-newsroom-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh both presentations from one public Wix feed read
        run: python automation/update_newsroom_feed_routed.py
      - name: Commit changed content and request the existing Pages publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CHANGED=false
          if ! git diff --quiet -- newsroom-preview/data/posts.json newsroom-preview/index.html gazette-live/posts.json; then
            git config user.name 'gatorbait-newsroom-bot'
            git config user.email 'brenden@gatorbaitmedia.com'
            git add newsroom-preview/data/posts.json newsroom-preview/index.html gazette-live/posts.json
            git commit -m 'data: refresh current Newsroom and Gazette stories'
            git push
            CHANGED=true
          fi
          # GITHUB_TOKEN commits do not trigger branch-based Pages automatically.
          # Ask the SAME native publisher to publish; no second artifact root.
          if [ "$CHANGED" = true ] || [ "$EVENT_NAME" = push ]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/pages/builds"
          else
            echo 'No publication content changed. No deployment requested.'
          fi

  # Scoreboard feed for the front page. Same workflow and 5-minute tick as the job above, no second scheduler.
  # Runs after `refresh` (never in parallel) so both jobs push to main one at a time, and runs even if
  # `refresh` failed. The script decides whether ESPN is worth reading: hourly, or every tick from an hour
  # before kickoff to five hours after. It refuses to write a file that fails validate_scoreboard.py.
  scoreboard:
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh sports-live/scoreboard.json from ESPN's public JSON
        # An ESPN outage or a rejected payload keeps the last good file and must not fail the newsroom feed.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          FORCE=""
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$EVENT_NAME" = push ]; then FORCE="--force"; fi
          python automation/scoreboard_feed.py $FORCE
      - name: Refresh Florida season stats from ESPN box scores
        # Every tick reads ESPN's schedule (two requests) so rankings, kickoff times and TV picks refresh
        # between games; box scores are read only when those rows changed or a game/corrections window is
        # open. Failed reads or checks preserve both the full snapshot and the compact feed the Wix embed reads.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python -m unittest -q automation/tests/test_florida_stats.py
          FORCE=""
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$EVENT_NAME" = push ]; then FORCE="--force"; fi
          python automation/florida_stats.py $FORCE --no-embed --feed sports-live/florida-stats.json
      - name: Validate, commit sports feeds if changed, and request the existing Pages publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python automation/validate_scoreboard.py sports-live/scoreboard.json
          SPORTS_FILES='sports-live/scoreboard.json deploy/wix-served/florida-stats.json sports-live/florida-stats.json'
          if git diff --quiet -- $SPORTS_FILES && [ -z "$(git ls-files --others --exclude-standard -- $SPORTS_FILES)" ]; then
            echo 'Sports feeds unchanged. No deployment requested.'
            exit 0
          fi
          git config user.name 'gatorbait-newsroom-bot'
          git config user.email 'brenden@gatorbaitmedia.com'
          git add $SPORTS_FILES
          git commit -m 'data: refresh Florida scoreboard and season stats'
          pushed=false
          for i in 1 2 3; do
            if git push; then pushed=true; break; fi
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          [ "$pushed" = true ] || { echo 'push failed after 3 tries; sports feeds not published' >&2; exit 1; }
          gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/pages/builds"

  # Buddy Martin Show uploads for the front page "Recent broadcasts" rail. Same workflow and 5-minute tick, no second
  # scheduler. Runs after `scoreboard` so the jobs push to main one at a time. The script rewrites
  # sports-live/episodes.json only when the newest uploads change or every 6 hours (the page ignores the file once
  # checkedAt is over 24 hours old), and a YouTube outage keeps the last good file without failing the workflow.
  episodes:
    needs: scoreboard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh sports-live/episodes.json from the channel's public RSS
        continue-on-error: true
        run: python automation/episodes_feed.py
      - name: Commit if changed and request the existing Pages publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- sports-live/episodes.json; then
            echo 'Episodes unchanged. No deployment requested.'
            exit 0
          fi
          git config user.name 'gatorbait-newsroom-bot'
          git config user.email 'brenden@gatorbaitmedia.com'
          git add sports-live/episodes.json
          git commit -m 'data: refresh Buddy Martin Show episodes'
          pushed=false
          for i in 1 2 3; do
            if git push; then pushed=true; break; fi
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          [ "$pushed" = true ] || { echo 'push failed after 3 tries; episodes not published' >&2; exit 1; }
          gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/pages/builds"
