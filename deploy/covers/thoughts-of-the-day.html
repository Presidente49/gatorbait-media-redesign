<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GatorBait Thoughts of the Day cover</title>
<meta name="viewport" content="width=1600">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* GatorBait "Thoughts of the Day" series cover, 1600x900, type-led (no photo). Same live-shots pipeline as template.html.
   Query: date=  hook=  by=  (series title default). Optional overrides: k1= k2= (kicker), l1= l2= (headline lines, l2 in orange), fs= (headline px), x= (left inset px, default 96; use ~240 so a centre-cropped thumbnail keeps the text) */
html,body{margin:0;background:#07122e}
.cover{position:relative;width:1600px;height:900px;overflow:hidden;background:#07122e;font-family:"Barlow",sans-serif;color:#fff}
.glow{position:absolute;inset:0;background:radial-gradient(70% 90% at 85% 100%,rgba(250,70,22,.34),rgba(250,70,22,0) 62%),radial-gradient(60% 70% at 0% 0%,rgba(30,64,140,.55),rgba(30,64,140,0) 65%)}
.stripes{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,rgba(255,255,255,0) 2px 46px)}
.bar{position:absolute;left:0;top:0;bottom:0;width:22px;background:#fa4616}
.copy{position:absolute;left:var(--x,96px);top:92px;right:96px;display:grid;gap:26px;align-content:start}
.kick{margin:0;display:inline-flex;gap:14px;align-items:center;font:800 28px/1 "Barlow Condensed",sans-serif;letter-spacing:.24em;text-transform:uppercase}
.kick b{background:#fa4616;color:#fff;padding:10px 16px 9px;border-radius:2px}
.kick span{color:#c8d3ef}
h1{margin:0;font:800 214px/.86 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.004em;text-shadow:0 6px 40px rgba(0,0,0,.4)}
h1 em{font-style:normal;color:#fa4616}
.rule{width:190px;height:10px;background:#fa4616}
.date{font:800 78px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.hook{margin:0;font:500 32px/1.3 "Barlow",sans-serif;color:#dfe6fb;max-width:980px}
.foot{position:absolute;left:var(--x,96px);right:96px;bottom:46px;display:flex;justify-content:space-between;align-items:flex-end}
.mark{font:800 36px/1 "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.mark i{font-style:normal;color:#fa4616}
.by{font:600 26px/1 "Barlow Condensed",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#c8d3ef}
</style></head><body>
<div class="cover" id="cover">
  <div class="glow"></div><div class="stripes"></div><div class="bar"></div>
  <div class="copy">
    <p class="kick"><b id="k1">Column</b><span id="k2">Daily on GatorBait Media</span></p>
    <h1 id="h1">Thoughts<br>of the <em>Day</em></h1>
    <div class="rule"></div>
    <div class="date" id="date"></div>
    <p class="hook" id="hook" style="margin:0"></p>
  </div>
  <div class="foot"><div class="mark">Gator<i>Bait</i> Media</div><div class="by" id="by"></div></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if(q.get('k1'))document.getElementById('k1').textContent=q.get('k1');
  if(q.get('k2'))document.getElementById('k2').textContent=q.get('k2');
  if(q.get('l1')){var h=document.getElementById('h1');h.textContent='';h.appendChild(document.createTextNode(q.get('l1')));if(q.get('l2')){h.appendChild(document.createElement('br'));var em=document.createElement('em');em.textContent=q.get('l2');h.appendChild(em);}if(q.get('fs'))h.style.fontSize=q.get('fs')+'px';}
  if(q.get('x'))document.getElementById('cover').style.setProperty('--x',q.get('x')+'px');
  document.getElementById('date').textContent = q.get('date') || '';
  document.getElementById('hook').textContent = q.get('hook') || '';
  document.getElementById('by').textContent = q.get('by') ? 'By ' + q.get('by') : '';
  document.getElementById('cover').setAttribute('data-ready', '1');
})();
</script></body></html>
