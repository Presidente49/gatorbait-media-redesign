<style id="gbm-keep-reading-css">
#gbm-kr{max-width:700px;margin:28px auto 8px;padding:18px 0 4px;border-top:6px solid #fa4616;font-family:Barlow,Arial,sans-serif;color:#081b35}
#gbm-kr h2{font:800 24px/1 Barlow,Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 14px;color:#081b35}
#gbm-kr .kr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
#gbm-kr a{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #dfe4ec;border-top:4px solid #081b35}
#gbm-kr a:hover,#gbm-kr a:focus-visible{border-top-color:#fa4616;outline:none}
#gbm-kr img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#081b35}
#gbm-kr .kr-t{display:block;padding:10px 12px 12px;font:800 17px/1.2 Barlow,Arial,sans-serif;color:#081b35}
@media(max-width:750px){#gbm-kr{margin-inline:0}#gbm-kr .kr-grid{grid-template-columns:1fr;gap:12px}#gbm-kr a{display:grid;grid-template-columns:110px 1fr}#gbm-kr img{height:100%;aspect-ratio:auto}#gbm-kr .kr-t{font-size:16px}}
#gbm-kr .kr-x{margin:22px 0 6px;padding:18px 16px 16px;background:#081b35;border-top:4px solid #fa4616}
#gbm-kr .kr-x h3{font:800 20px/1 Barlow,Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#fff;margin:0 0 12px}
#gbm-kr .kr-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#gbm-kr .kr-nav a{display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px 10px;background:#12305c;border:0;border-radius:6px;color:#fff;text-align:center;font:700 17px/1.15 Barlow,Arial,sans-serif}
#gbm-kr .kr-nav a:hover,#gbm-kr .kr-nav a:focus-visible{background:#fa4616;outline:none}
#gbm-kr .kr-nav a.kr-acct{background:#fa4616}
@media(max-width:750px){#gbm-kr .kr-nav{grid-template-columns:repeat(2,minmax(0,1fr))}#gbm-kr .kr-nav a{display:flex;font-size:17px}#gbm-kr .kr-nav a.kr-acct{grid-column:1/-1}}
/* "By the numbers" box: the template's generic dark paragraph color loads later and wins at equal specificity (navy on navy). */
html body #SITE_PAGES [data-hook=post-page] [data-hook=post-description] [data-gbm-stat] p,html body #SITE_PAGES [data-hook=post-page] [data-hook=post-description] [data-gbm-stat] p>span>span{color:#e6ecf5!important}
</style>
<script>(function(){
'use strict';if(window.__GBM_KR__)return;window.__GBM_KR__=1;
var MAX_AGE=14*864e5,feed=null;
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safe(u,img){try{var x=new URL(u,location.origin);if(x.protocol!=='https:')return'';if(img)return x.hostname==='static.wixstatic.com'?x.href:'';return /(^|\.)gatorbaitmedia\.com$/.test(x.hostname)&&x.pathname.indexOf('/post/')===0?x.pathname:'';}catch(e){return'';}}
function load(){if(feed)return feed;feed=fetch('/blog-feed.xml?t='+Math.floor(Date.now()/6e5),{credentials:'omit',cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(x){var d=new DOMParser().parseFromString(x,'text/xml');return Array.prototype.map.call(d.querySelectorAll('item'),function(n){var g=function(k){var e=Array.prototype.find.call(n.children,function(c){return c.localName===k;});return e?e.textContent.trim():'';};var enc=n.querySelector('enclosure');return{t:g('title'),u:safe(g('link')),d:Date.parse(g('pubDate')),i:enc?safe(enc.getAttribute('url'),true):''};}).filter(function(p){return p.t&&p.u&&p.d&&Date.now()-p.d<MAX_AGE&&!/^LIVE NOW:/i.test(p.t);}).sort(function(a,b){return b.d-a.d;});}).catch(function(){feed=null;return[];});return feed;}
var NAV=[['Front Page','/'],['Latest stories','/gatorbait-media-blogs'],['Football','/gatorbait-media-blogs/categories/gator-football'],['Recruiting','/gatorbait-media-blogs/categories/gator-recruiting'],['Basketball','/gatorbait-media-blogs/categories/gator-basketball'],['GatorBait Magazine','/magazine'],['Buddy Martin Show','/the-buddy-martin-show'],['Message Board','/groups'],['Your account','/account/my-account','kr-acct']];
function navHtml(){return'<div class="kr-x"><h3>Explore GatorBait</h3><nav class="kr-nav" aria-label="Explore GatorBait">'+NAV.map(function(n){return'<a href="'+n[1]+'"'+(n[2]?' class="'+n[2]+'"':'')+'>'+n[0]+'</a>';}).join('')+'</nav></div>';}
function run(){
var here=(location.pathname||'').replace(/\/+$/,''),old=document.getElementById('gbm-kr');
if(old&&(old.getAttribute('data-for')!==here||!old.getClientRects().length))old.remove();
if(!/^\/post\//.test(here)||document.getElementById('gbm-kr'))return;
var bs=Array.prototype.slice.call(document.querySelectorAll('[data-hook=post-description]')),body=bs.filter(function(x){return x.getClientRects().length;})[0]||bs[0];if(!body)return;
load().then(function(list){
if(document.getElementById('gbm-kr')||!document.contains(body))return;
var picks=list.filter(function(p){return p.u.replace(/\/+$/,'')!==here;}).slice(0,3);if(picks.length<2)picks=[];
var s=document.createElement('section');s.id='gbm-kr';s.setAttribute('data-for',here);s.setAttribute('aria-label','Keep reading');
s.innerHTML=(picks.length?'<h2>Keep reading</h2><div class="kr-grid">'+picks.map(function(p){return'<a href="'+esc(p.u)+'">'+(p.i?'<img src="'+esc(p.i)+'" alt="" loading="lazy" decoding="async">':'')+'<span class="kr-t">'+esc(p.t)+'</span></a>';}).join('')+'</div>':'')+navHtml();
var more=document.querySelector('[data-story-kit=more]');if(more&&body.contains(more))more.insertAdjacentElement('afterend',s);else body.appendChild(s);
});
}
function sched(){[300,1200,3000,6000].forEach(function(ms){setTimeout(run,ms);});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sched,{once:true});else sched();
window.addEventListener('popstate',sched);window.addEventListener('gbmroutechange',sched);
})();</script>
