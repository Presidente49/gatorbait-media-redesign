name: Post phone probe (read-only)

on:
  push:
    branches: ['probe/**']
  workflow_dispatch:
    inputs:
      url:
        description: Post URL to render
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - run: node automation/vision/post-probe.mjs
        env:
          PROBE_URL: ${{ github.event.inputs.url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-probe
          path: build/post-probe
          if-no-files-found: warn
