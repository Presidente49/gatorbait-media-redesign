name: Refresh GatorBait publication feeds

on:
  push:
    branches: [main]
    paths:
      - 'automation/update_newsroom_feed.py'
      - 'automation/update_newsroom_feed_routed.py'
      - 'newsroom-preview/editorial-routing.json'
      - '.github/workflows/refresh-newsroom-feed.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-newsroom-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh both presentations from one public Wix feed read
        if: github.ref == 'refs/heads/main'
        run: python automation/update_newsroom_feed_routed.py
      # Florida football stats: reads ESPN only in a game window, hourly for 3 days after a final,
      # and once a day; otherwise a no-op. A failed read or check keeps the last good snapshot
      # and never blocks the newsroom refresh.
      - name: Refresh Florida football stats from ESPN box scores
        continue-on-error: true
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: |
          python -m unittest -q automation/tests/test_florida_stats.py
          python automation/florida_stats.py $FORCE
      - name: Commit changed content and request the existing Pages publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CHANGED=false
          STATS=false
          git config user.name 'gatorbait-newsroom-bot'
          git config user.email 'brenden@gatorbaitmedia.com'
          if ! git diff --quiet -- newsroom-preview/data/posts.json newsroom-preview/index.html gazette-live/posts.json; then
            git add newsroom-preview/data/posts.json newsroom-preview/index.html gazette-live/posts.json
            git commit -m 'data: refresh current Newsroom and Gazette stories'
            CHANGED=true
          fi
          if [ -n "$(git status --porcelain -- deploy/wix-served/florida-stats.json deploy/wix-served/florida-stats.html)" ]; then
            git add deploy/wix-served/florida-stats.json deploy/wix-served/florida-stats.html
            git commit -m 'data: refresh Florida football stats from ESPN box scores'
            STATS=true
          fi
          if [ "$CHANGED" = true ] || [ "$STATS" = true ]; then
            git push
          fi
          # GITHUB_TOKEN commits do not trigger branch-based Pages automatically.
          # Ask the SAME native publisher to publish; no second artifact root.
          if [ "$CHANGED" = true ] || [ "$EVENT_NAME" = push ]; then
            gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/pages/builds"
          else
            echo 'No publication content changed. No deployment requested.'
          fi
