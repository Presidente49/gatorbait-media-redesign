# The Stands: local dev config. `wrangler dev` runs worker.mjs under workerd with a SQLite-backed Durable Object.
# Production values are NOT here: TOKEN_SECRET and MOD_KEY go in with `wrangler secret put`, DEV_TOKENS stays unset,
# SCOREBOARD_URL points at the Pages copy of sports-live/scoreboard.json. Deploying needs the controller.
name = "the-stands"
main = "worker.mjs"
compatibility_date = "2025-09-01"
workers_dev = false

[vars]
DEV_TOKENS = "1"
TOKEN_SECRET = "dev-only-not-a-secret"
MOD_KEY = "dev-only-mod-key"
SCOREBOARD_URL = ""

[durable_objects]
bindings = [{ name = "ROOMS", class_name = "StandsRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StandsRoom"]
