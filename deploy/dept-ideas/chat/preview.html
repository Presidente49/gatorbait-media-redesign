<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Stands — GatorBait Live Chat</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--n:#07122e;--b:#0021a5;--o:#fa4616;--ink:#f3f5fa;--mut:#b9c4dc;--c:"Barlow Condensed","Barlow",sans-serif;--s:"Barlow",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--n);color:var(--ink);font:16px/1.45 var(--s)}
.wrap{max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}
.note{margin:0;padding:8px 12px;font:700 11px/1.3 var(--c);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-align:center}.note b{color:var(--o)}
.tabs{display:flex;gap:6px;padding:0 12px 8px}
.tabs button{flex:1;min-height:36px;background:none;color:var(--ink);border:2px solid rgba(255,255,255,.25);font:800 12px/1 var(--c);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--o);border-color:var(--o)}
.room{flex:1;display:flex;flex-direction:column;min-height:0;background:#040b1f;border-top:3px solid var(--o)}
.strip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px 10px;padding:10px 12px;background:radial-gradient(80% 100% at 50% 0,rgba(0,33,165,.6),transparent 70%);border-bottom:1px solid rgba(255,255,255,.12)}
.t{display:grid;gap:3px}.t small{font:700 10px/1 var(--c);letter-spacing:.14em;text-transform:uppercase;color:#ffb08f}.t b{font:800 22px/1 var(--c);text-transform:uppercase}.t.h{text-align:right}
.sc{display:flex;gap:8px;align-items:baseline;font:800 36px/1 var(--c);font-variant-numeric:tabular-nums}.sc i{color:var(--o);font-style:normal;font-size:.6em}
.clk{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:8px;font:700 11px/1 var(--c);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.clk em{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;background:#c8102e;color:#fff;font-style:normal;font-weight:800}.clk em::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff}
.show{grid-column:1/-1;text-align:center;display:grid;gap:4px}.show b{font:800 26px/1 var(--c);text-transform:uppercase}
.hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font:800 14px/1 var(--c);letter-spacing:.12em;text-transform:uppercase}.hd span{font:600 12px/1 var(--s);letter-spacing:0;text-transform:none;color:var(--mut)}
.sys{margin:0 12px 8px;padding:8px 10px;background:rgba(0,33,165,.35);border-left:3px solid var(--o);font:600 12px/1.4 var(--s);color:var(--mut)}
.feed{flex:1;overflow-y:auto;padding:4px 12px 8px;display:flex;flex-direction:column;gap:10px;min-height:0}
.p{display:grid;grid-template-columns:1fr auto;gap:2px 8px;animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.who{display:flex;gap:6px;align-items:center;font:700 12px/1 var(--c);letter-spacing:.1em;text-transform:uppercase;color:#c8d3ef}.who time{font:600 10px/1 var(--s);letter-spacing:0;text-transform:none;color:var(--mut)}
.bd{padding:3px 5px;border-radius:2px;background:var(--o);color:#fff;font:800 9px/1 var(--c);letter-spacing:.1em}.bd.s{background:var(--b)}
.p p{margin:0;font-size:15px}
.rp{grid-row:1/3;align-self:start;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:none;color:var(--mut);font:800 12px/1 var(--c);cursor:pointer}.rp.on{background:var(--o);border-color:var(--o);color:#fff}
.slow{display:flex;justify-content:space-between;padding:0 12px 6px;font:600 11px/1.3 var(--s);color:var(--mut)}
.in{display:flex;gap:8px;padding:8px 12px 12px;border-top:1px solid rgba(255,255,255,.12)}
.in input{flex:1;min-width:0;min-height:44px;padding:0 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:var(--ink);font:400 15px var(--s)}.in input:disabled{opacity:.6}
.in button{min-height:44px;padding:0 16px;border:0;background:var(--o);color:#fff;font:800 15px/1 var(--c);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.quiet{display:none;flex:1;align-content:center;gap:10px;padding:24px 16px;text-align:center}.quiet h2{margin:0;font:800 30px/1 var(--c);text-transform:uppercase}.quiet p{margin:0;font-size:14px;color:var(--mut)}.quiet b{color:var(--ink)}
.cd{display:flex;justify-content:center;gap:12px;font:800 44px/1 var(--c);font-variant-numeric:tabular-nums}.cd span{display:grid}.cd i{font:700 10px/1 var(--c);letter-spacing:.14em;color:#ffb08f;font-style:normal}
.room[data-mode=quiet] .quiet{display:grid}.room[data-mode=quiet] .feed,.room[data-mode=quiet] .sys,.room[data-mode=quiet] .slow{display:none}
@media(prefers-reduced-motion:reduce){.p{animation:none}}
</style></head><body><div class="wrap">
<p class="note"><b>Mockup</b> · simulated game, fictional handles</p>
<div class="tabs" role="group" aria-label="Preview state"><button aria-pressed="true" data-m="game">Game day</button><button aria-pressed="false" data-m="quiet">Quiet room</button><button aria-pressed="false" data-m="show">Show night</button></div>
<section class="room" data-mode="game" aria-label="The Stands, GatorBait live chat">
<div class="strip" id="strip"></div>
<div class="hd">The Stands <span>Signed in with Wix Members</span></div>
<p class="sys" id="sys"></p>
<div class="feed" id="feed" aria-live="polite"></div>
<div class="quiet" id="quiet"></div>
<div class="slow"><span id="slow">Slow mode: one post every 30 seconds</span><span>Members: no wait</span></div>
<form class="in" id="f"><input id="msg" maxlength="240" autocomplete="off" placeholder="Say something, Gators" aria-label="Message"><button type="submit">Send</button></form>
</section></div>
<script>
(function(){
var $=function(s){return document.getElementById(s)};var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var KICK=Date.parse('2026-10-03T19:30:00Z'),secs=8*60+14,mode='game';
var SYS={game:'Members-only mode ran for the first five minutes after kickoff. The room is open to every signed-in reader now. Slow mode is on.',show:'Show night. Buddy is live on YouTube and Facebook. End a post with a question mark and it lands on the producer\'s screen.'};
var POSTS=[['TailgateTina','Columbia is loud tonight. Third-and-long every drive so far.','m'],['SwampThing_91','That screen pass was drawn up perfectly. Run it again.'],['BullGatorBob','Buddy said Tuesday it would come down to the offensive line. Here we are.','m'],['MizzouNeighbor','Respect from the gold side. Your defensive line is a problem.'],['AlbertsCousin','Timeout? Why now?'],['GatorBait Staff','Injury note: nothing official yet on the left tackle. We will post here the minute the sideline confirms.','s'],['OrangeAndBlueDemo','Anyone else running 30 seconds behind on the stream?'],['TailgateTina','Mine too. Watch the score strip up top, it beats the broadcast.','m'],['SixToesSam','FIELD GOAL. 24-17.'],['GatorGrannyRuth','Hold on, y\'all. Long way to go.'],['BullGatorBob','The preview called the quick game. Sumrall listened.','m'],['SwampThing_91','Defense, one more stop.']];
var LATER=[['AlbertsCousin','Third down. Everybody up.'],['GatorGrannyRuth','Slow mode is the best thing that ever happened to my caps lock.'],['MizzouNeighbor','That was a hold. I will say it once.'],['SixToesSam','Tunnel light is orange on the homepage. Love that.'],['TailgateTina','Fresh legs on the punt return, please.','m']];
var feed=$('feed'),n=0;
function clock(){var m=Math.floor(secs/60),s=secs%60;return (mode==='game'?'3rd · ':'')+m+':'+(s<10?'0':'')+s}
function strip(){
if(mode==='show'){$('strip').innerHTML='<div class="show"><small class="clk"><em>Live now</em> Wednesday · 9 p.m. ET</small><b>The Buddy Martin Show</b><small class="clk">YouTube and Facebook · Mon., Wed. and Thu.</small></div>';return}
$('strip').innerHTML='<span class="t"><small>No. 8 · 4-0</small><b>Florida</b></span><span class="sc"><b>24</b><i>–</i><b>17</b></span><span class="t h"><small>No. 25</small><b>Missouri</b></span><p class="clk"><em>Live</em><span id="clk">'+clock()+'</span><span>ABC · Memorial Stadium</span></p>'}
function stamp(){var d=new Date();var h=d.getHours(),m=d.getMinutes();return (h%12||12)+':'+(m<10?'0':'')+m+(h<12?' a.m.':' p.m.')}
function add(p,you){var el=document.createElement('div');el.className='p';var b=p[2]==='m'?'<i class="bd">Member</i>':p[2]==='s'?'<i class="bd s">GatorBait</i>':'';
el.innerHTML='<div class="who">'+esc(p[0])+b+'<time>'+stamp()+'</time></div><p>'+esc(p[1])+'</p>'+(you?'':'<button class="rp" type="button" title="Report this post" aria-label="Report this post">!</button>');
var near=feed.scrollHeight-feed.scrollTop-feed.clientHeight<80;feed.appendChild(el);while(feed.children.length>40)feed.removeChild(feed.firstChild);if(near||you)feed.scrollTop=feed.scrollHeight}
feed.addEventListener('click',function(e){var b=e.target.closest('.rp');if(!b)return;b.classList.add('on');b.textContent='✓';b.title='Reported. A moderator will look.';b.disabled=true});
function pad(x){return (x<10?'0':'')+x}
function quiet(){var s=Math.max(0,Math.floor((KICK-Date.now())/1000));var d=Math.floor(s/86400),h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60,x=s%60;
$('quiet').innerHTML='<h2>Quiet in here</h2><p>Kickoff in</p><div class="cd"><span>'+pad(d)+'<i>days</i></span><span>'+pad(h)+'<i>hrs</i></span><span>'+pad(m)+'<i>min</i></span><span>'+pad(x)+'<i>sec</i></span></div><p><b>No. 8 Florida at No. 25 Missouri</b><br>Sat., Oct. 3, 3:30 p.m. ET · ABC</p><p>Last: Florida 52, No. 4 Ole Miss 28 (Sept. 26)</p><p>Next show: Wednesday, 9 p.m. ET · The room opens 30 minutes before kickoff and showtime.</p>'}
function setMode(m){mode=m;$('sys').textContent=SYS[m]||'';document.querySelector('.room').setAttribute('data-mode',m);strip();quiet();
document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-m')===m?'true':'false')})}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setMode(b.getAttribute('data-m'))});
var BAD=/\b(damn|hell|crap)\b/gi,wait=0;
$('f').addEventListener('submit',function(e){e.preventDefault();var v=$('msg').value.trim();if(!v||wait)return;var t=v.replace(BAD,function(w){return w[0]+'***'});add(['You',t],true);$('msg').value='';
if(t!==v)$('sys').textContent='A word was masked by the filter. Keep it family friendly.';
wait=30;$('msg').disabled=true;var tick=setInterval(function(){wait--;$('slow').textContent='Slow mode: next post in '+wait+' s';if(wait<=0){clearInterval(tick);$('msg').disabled=false;$('slow').textContent='Slow mode: one post every 30 seconds'}},1000)});
POSTS.forEach(function(p){add(p)});setMode('game');
setInterval(function(){if(secs>0){secs--;var c=$('clk');if(c)c.textContent=clock()}if(mode==='quiet')quiet()},1000);
setInterval(function(){if(mode!=='quiet'){add(LATER[n%LATER.length]);n++}},6000);
})();
</script></body></html>
