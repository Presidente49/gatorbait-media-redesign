<!-- GBM_LIVEBAND_V1 sitewide Buddy Martin Show live strip -->
<style id="gbm-liveband-css">#gbm-liveband{position:relative;z-index:30;background:#10264b;color:#fff;border-bottom:3px solid #fa4616;font:600 15px/1.2 Barlow,Arial,sans-serif}#gbm-liveband *{box-sizing:border-box}#gbm-liveband .lb{max-width:1320px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}#gbm-liveband .lb-mark{display:flex;flex-direction:column;line-height:.92;font:800 19px/.92 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.02em;text-transform:uppercase;color:#fff;text-decoration:none;padding:5px 12px;border:2px solid #fa4616}#gbm-liveband .lb-mark small{font:700 11px/1.1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.2em;color:#ffb08f;margin-bottom:2px}#gbm-liveband .lb-st{display:inline-flex;align-items:center;gap:8px;font:800 14px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ffb08f}#gbm-liveband .lb-st i{width:9px;height:9px;border-radius:50%;background:#9aa5b8}#gbm-liveband .on i,#gbm-liveband .soon i{background:#fa4616;box-shadow:0 0 0 4px #fa461640}#gbm-liveband .lb-tx{flex:1 1 220px;min-width:0;font:500 16px/1.25 Barlow,sans-serif;color:#dce4f2}#gbm-liveband .lb-tx b{color:#fff;font-weight:700}#gbm-liveband .lb-go{margin-left:auto;display:inline-flex;align-items:center;min-height:40px;padding:0 18px;background:#fa4616;color:#10264b;text-decoration:none;font:800 15px "Barlow Condensed",Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase}#gbm-liveband a:focus-visible{outline:3px solid #fff;outline-offset:2px}@media(max-width:700px){#gbm-liveband .lb{padding:7px 12px;gap:6px 10px;flex-wrap:nowrap}#gbm-liveband .lb-tx{display:none}#gbm-liveband .lb-mark{font-size:14px;padding:4px 8px;flex:0 0 auto}#gbm-liveband .lb-mark small{font-size:10px;letter-spacing:.12em}#gbm-liveband .lb-st{display:none}#gbm-liveband .lb-st{font-size:12px;letter-spacing:.08em;min-width:0}#gbm-liveband .lb-go{min-height:36px;padding:0 12px;font-size:14px;flex:0 0 auto}}#gbm-liveband .lb{justify-content:space-between}</style>
<script id="gbm-liveband-js">(function(){
if(window.__GBM_LB__)return;window.__GBM_LB__=1;
var CH='https://www.youtube.com/@TheBuddyMartinShow/live';
function et(){var o={},p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());p.forEach(function(x){o[x.type]=x.value});return{wd:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(o.weekday),m:(parseInt(o.hour,10)%24)*60+parseInt(o.minute,10)}}
function st(){var t=et(),s=t.wd>=1&&t.wd<=4;
if(s&&t.m>=1260&&t.m<1320)return['on','On air now','<b>Live now on YouTube.</b> Join Buddy and the show.'];
if(s&&t.m<1260)return['soon','Live tonight','<b>Tonight at 9 p.m. ET.</b> Live on YouTube, Monday through Thursday.'];
return['off','Next show '+((t.wd>=4||t.wd===0)?'Monday':'tomorrow'),'<b>9 p.m. ET.</b> Live on YouTube, Monday through Thursday.']}
function build(){var s=st(),d=document.createElement('div');d.id='gbm-liveband';d.setAttribute('role','region');d.setAttribute('aria-label','The Buddy Martin Show live schedule');
d.innerHTML='<div class="lb"><a class="lb-mark" href="/the-buddy-martin-show"><small>Live Mon&ndash;Thu &middot; 9 p.m. ET</small>The Buddy Martin Show</a><span class="lb-st '+s[0]+'"><i></i>'+s[1]+'</span><span class="lb-tx">'+s[2]+'</span><a class="lb-go" href="'+CH+'">'+(s[0]==='on'?'Watch now':'Watch live')+'</a></div>';return d}
function mount(){var a=document.getElementById('gbm-mobile-shell-host')||document.getElementById('gbm-site-header');if(!a||a.parentNode!==document.body)return;
var o=document.getElementById('gbm-liveband');if(o&&o.previousElementSibling===a)return;if(o)o.remove();a.parentNode.insertBefore(build(),a.nextSibling)}
mount();var n=0,iv=setInterval(function(){mount();if(++n>40)clearInterval(iv)},500);
try{new MutationObserver(function(){if(!document.getElementById('gbm-liveband'))mount()}).observe(document.body,{childList:true})}catch(e){}
setInterval(function(){var o=document.getElementById('gbm-liveband');if(o){o.remove();mount()}},60000);
window.addEventListener('gbmroutechange',mount);window.addEventListener('popstate',function(){setTimeout(mount,50)});
})();</script>
