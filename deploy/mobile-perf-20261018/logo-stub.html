<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile header logo: before and after (local stub)</title>
<!-- Local stub of the phone header from embed fdc2127a (#gbm-mobile-shell). Not live. Barlow only. -->
<style>
@font-face{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/barlow-condensed@5.3.0/files/barlow-condensed-latin-900-italic.woff2) format("woff2")}
@font-face{font-family:Barlow;font-style:normal;font-weight:800;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/barlow@5.3.0/files/barlow-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:Barlow;font-style:normal;font-weight:700;font-display:swap;src:url(https://cdn.jsdelivr.net/npm/@fontsource/barlow@5.3.0/files/barlow-latin-700-normal.woff2) format("woff2")}
*{box-sizing:border-box}
body{margin:0;background:#eef1f6;font-family:Barlow,sans-serif;color:#08132f}
.frame{width:390px;margin:0 0 14px}
.cap{font:700 12px/1 Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;color:#4b5a7a}
/* copied from the live shell, unchanged */
#gbm-mobile-shell{box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;background:#fff;border-top:4px solid #fa4616;border-bottom:1px solid #dfe4ec;box-shadow:0 3px 12px #08132f14}
#gbm-mobile-shell .gbm-ms-logo{display:block;width:min(180px,52vw);line-height:0}
#gbm-mobile-shell .gbm-ms-logo img{display:block;width:100%;height:auto;max-height:44px;object-fit:contain}
.gbm-ms-trigger{border:1px solid #b8c1d0;background:#fff;color:#08132f;width:72px;height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;font:900 11px/1 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase}
/* PROPOSED: CSS wordmark in place of the script logo image (no image request) */
#gbm-mobile-shell .gbm-ms-logo.is-wm{width:auto;min-height:44px;display:flex;align-items:center;line-height:1;text-decoration:none}
.gbm-ms-wm{display:flex;align-items:baseline;font:italic 900 31px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em;text-transform:uppercase;color:#08132f;white-space:nowrap}
.gbm-ms-wm b{color:#fa4616;font-weight:900}
.gbm-ms-wm small{font:800 10px/1 Barlow,sans-serif;letter-spacing:.28em;color:#4b5a7a;margin-left:7px}
</style>
</head>
<body>
<div class="frame"><div class="cap">Before: script logo, image request</div>
<header id="gbm-mobile-shell"><a class="gbm-ms-logo" href="/"><img src="https://static.wixstatic.com/media/d3cfa5_95dd8a25863b4556b7ba6398fcfd0316~mv2.webp/v1/fill/w_500,h_134,al_c,q_85,enc_auto/gatorbait.webp" alt="GatorBait Media"></a><button class="gbm-ms-trigger">Menu</button></header></div>
<div class="frame"><div class="cap">After: Barlow wordmark, zero image bytes</div>
<header id="gbm-mobile-shell"><a class="gbm-ms-logo is-wm" href="/" aria-label="GatorBait Media home"><span class="gbm-ms-wm" aria-hidden="true">Gator<b>Bait</b><small>Media</small></span></a><button class="gbm-ms-trigger">Menu</button></header></div>
</body>
</html>
