name: Refresh standalone newsroom feed

on:
  push:
    branches: [main]
    paths:
      - 'automation/update_newsroom_feed.py'
      - '.github/workflows/refresh-newsroom-feed.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-newsroom-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull newest Wix Blog posts and prerender homepage
        run: python automation/update_newsroom_feed.py

      - name: Commit only when the published story set changed
        shell: bash
        run: |
          if git diff --quiet -- newsroom-preview/data/posts.json newsroom-preview/index.html; then
            echo 'No newsroom changes.'
            exit 0
          fi
          git config user.name 'gatorbait-newsroom-bot'
          git config user.email 'brenden@gatorbaitmedia.com'
          git add newsroom-preview/data/posts.json newsroom-preview/index.html
          git commit -m 'data: refresh latest GatorBait stories'
          git push
