name: ESPN probe (one-off, read-only)
on:
  push:
    branches:
      - 'probe/espn-20261017'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load the live homepage like a reader and log what the card fetches
        run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > run.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1366, height: 900 } });
            p.on('console', m => { if (/error|fail|espn|gbm/i.test(m.text())) console.log('CONSOLE', m.type(), m.text().slice(0, 200)); });
            p.on('requestfailed', r => { if (/espn|scoreboard|github\.io|jsdelivr/.test(r.url())) console.log('REQFAIL', r.url().slice(0, 140), r.failure() && r.failure().errorText); });
            p.on('response', r => { if (/espn|scoreboard\.json|jsdelivr|blog-feed/.test(r.url())) console.log('RESP', r.status(), r.url().slice(0, 150)); });
            await p.goto('https://www.gatorbaitmedia.com/?v=probe' + Date.now(), { waitUntil: 'load' });
            await p.waitForTimeout(4000);
            const u = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=8&dates=20261017';
            const r = await p.evaluate(async (u) => {
              const out = {};
              const tries = {
                'no-store+omit (what the card does)': { cache: 'no-store', credentials: 'omit' },
                'plain omit (proposed fix)': { credentials: 'omit' },
                'plain': {}
              };
              for (const [k, o] of Object.entries(tries)) {
                try {
                  const x = await fetch(u + '&_=' + Date.now(), o);
                  const j = await x.json();
                  const e = (j.events || []).find(e => String(e.id) === '401856724');
                  out[k] = 'OK ' + x.status + ' ' + (e ? e.status.type.shortDetail + ' ' + e.competitions[0].competitors.map(c => c.team.abbreviation + c.score).join(' ') : 'event missing');
                } catch (err) { out[k] = 'FAIL ' + String(err).slice(0, 80); }
              }
              return out;
            }, u);
            console.log('FETCH TESTS', JSON.stringify(r, null, 1));
            await b.close();
          })();
          JS
          node run.js
