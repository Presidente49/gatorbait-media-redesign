name: GatorBait live screenshots

# On-demand real-browser screenshots of production, pushed to the orphan branch qa/live-shots
# (one commit, replaced each run) so a cloud session without site access can review them:
#   git fetch origin qa/live-shots && git show origin/qa/live-shots --stat
# Two ways to ask for a run:
#   - workflow_dispatch with inputs (needs Actions write access), or
#   - push a branch named shots/<anything> carrying automation/vision/live-shots.request.json,
#     e.g. {"path":"/","selector":"#gbm-road","widths":"390,1365"} (works from a GitHub App
#     that can push but cannot dispatch workflows). Add "perf":"1" to also measure load performance
#     under phone throttling (metrics.json gets a perf block per width).
# Read-only against the site; writes nothing but that branch.

on:
  push:
    branches:
      - 'shots/**'
  workflow_dispatch:
    inputs:
      path:
        description: 'Page path on www.gatorbaitmedia.com, query allowed'
        default: '/'
        required: false
      selector:
        description: 'Element to scroll to and capture (blank for none)'
        default: '#gbm-road'
        required: false
      widths:
        description: 'Comma list of viewport widths'
        default: '390,1365'
        required: false
      perf:
        description: 'Set to 1 to also measure load performance'
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: live-shots
  cancel-in-progress: false

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve request
        id: req
        env:
          IN_PATH: ${{ github.event.inputs.path }}
          IN_SELECTOR: ${{ github.event.inputs.selector }}
          IN_WIDTHS: ${{ github.event.inputs.widths }}
          IN_PERF: ${{ github.event.inputs.perf }}
        run: |
          node -e '
            const fs = require("fs");
            let r = { path: process.env.IN_PATH, selector: process.env.IN_SELECTOR, widths: process.env.IN_WIDTHS, perf: process.env.IN_PERF };
            const f = "automation/vision/live-shots.request.json";
            if (process.env.GITHUB_EVENT_NAME === "push" && fs.existsSync(f)) r = JSON.parse(fs.readFileSync(f, "utf8"));
            const path = r.path || "/", selector = r.selector === undefined ? "#gbm-road" : r.selector, widths = r.widths || "390,1365", perf = String(r.perf || "") === "1" ? "1" : "";
            // A path under deploy/covers/ is a repo file rendered from the checkout (file://), not the site.
            if (!/^\/[\w\-./?=&%#+|]*$/.test(path) && !/^deploy\/covers\/[\w\-.]+\.html(\?[\w\-.~%+=&]*)?$/.test(path)) throw new Error("bad path");
            if (!/^[\d,]+$/.test(widths)) throw new Error("bad widths");
            if (!/^[\w\-#.\[\]=:" ]*$/.test(selector)) throw new Error("bad selector");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${path}\nselector=${selector}\nwidths=${widths}\nperf=${perf}\n`);
            console.log({ path, selector, widths, perf });
          '

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Shoot production
        env:
          PERF: ${{ steps.req.outputs.perf }}
        run: node automation/vision/live-shots.mjs "${{ steps.req.outputs.path }}" "${{ steps.req.outputs.selector }}" "${{ steps.req.outputs.widths }}"

      - name: Publish to qa/live-shots
        run: |
          set -e
          cd build/live-shots
          git init -q
          git checkout -q -b qa/live-shots
          git config user.name "gatorbait-live-shots"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "live shots: ${{ steps.req.outputs.path }} ${{ steps.req.outputs.selector }} ${{ steps.req.outputs.widths }}${{ steps.req.outputs.perf == '1' && ' perf' || '' }} (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" qa/live-shots
