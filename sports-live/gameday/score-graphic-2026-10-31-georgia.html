<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Florida-Georgia score graphic</title>
<style>
@font-face{font-family:'Barlow';font-weight:500;src:url('../../assets/weather/Barlow-500.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;src:url('../../assets/weather/Barlow-700.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:800;src:url('../../assets/weather/Barlow-800.woff2') format('woff2')}
:root{--navy:#0B1F4B;--orange:#FA4616;--blue:#0021A5;--white:#fff;--mute:#9FB2CF}
*{box-sizing:border-box}
html,body{margin:0;background:#050f26}
/* Fixed 1080x1350 master. Narrow viewports scale it down (see script) so nothing reflows or overflows. */
.stage{width:1080px;height:1350px;transform-origin:top left}
.c{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Barlow',sans-serif;color:var(--white);
background:radial-gradient(900px 620px at 100% 100%,rgba(250,70,22,.38),transparent 62%),radial-gradient(700px 520px at 0% 0%,rgba(0,33,165,.55),transparent 65%),linear-gradient(160deg,#081845 0%,var(--navy) 55%,#07173d 100%)}
.c:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 54px)}
.bar{position:absolute;left:0;top:0;bottom:0;width:22px;background:var(--orange)}
.top{position:absolute;left:84px;right:72px;top:72px;display:flex;align-items:center;gap:20px}
.tag{background:var(--orange);font-weight:800;font-size:40px;letter-spacing:4px;padding:8px 24px;text-transform:uppercase;white-space:nowrap}
.kick{font-weight:700;font-size:34px;letter-spacing:4px;color:#C9D6EA;text-transform:uppercase;white-space:nowrap}
.team{position:absolute;left:84px;right:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.t1{top:250px}.t2{top:632px}
.vs{position:absolute;left:84px;top:540px;font-weight:800;font-size:38px;letter-spacing:6px;color:var(--orange)}
.who{min-width:0}
.rk{font-weight:800;font-size:46px;letter-spacing:3px;color:var(--orange);text-transform:uppercase;height:52px;line-height:52px}
.nm{font-weight:800;font-size:150px;line-height:1;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.rec{font-weight:700;font-size:40px;letter-spacing:3px;color:#C9D6EA;margin-top:8px}
.sc{font-weight:800;font-size:300px;line-height:1;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.lead{color:var(--white)}.trail{color:var(--mute)}
.rule{position:absolute;left:84px;top:960px;width:180px;height:10px;background:var(--orange)}
.info{position:absolute;left:84px;right:72px;top:996px}
.big{font-weight:800;font-size:62px;line-height:1.1;text-transform:uppercase;letter-spacing:1px}
.big b{color:var(--orange);font-weight:800}
.sub{font-weight:600;font-size:38px;line-height:1.3;color:#D5DFEC;margin-top:14px}
.ls{margin-top:18px;display:flex;gap:36px;font-weight:700;font-size:34px;color:#C9D6EA;font-variant-numeric:tabular-nums}
.ls span{min-width:0}
.logo{position:absolute;left:84px;bottom:56px;font-weight:800;font-size:48px;letter-spacing:5px}
.logo b{color:var(--orange)}
.src{position:absolute;right:72px;bottom:64px;font-weight:500;font-size:24px;letter-spacing:1px;color:#8FA3C4;text-align:right}
</style></head><body>
<div class="stage" id="stage"><div class="c" id="c">
<div class="bar"></div>
<div class="top"><span class="tag" id="tag"></span><span class="kick" id="kick"></span></div>
<div class="team t1" id="t1"></div>
<div class="vs" id="vs">VS.</div>
<div class="team t2" id="t2"></div>
<div class="rule"></div>
<div class="info"><div class="big" id="big"></div><div class="sub" id="sub"></div><div class="ls" id="ls"></div></div>
<div class="logo">GATOR<b>BAIT</b> MEDIA</div>
<div class="src" id="src"></div>
</div></div>
<script>
/* Data comes from window.__SCORE__ (set by render-score.mjs) or ?data=file.json for a browser preview. */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const ord=n=>({1:'1st',2:'2nd',3:'3rd',4:'4th'}[n]||(n>4?'OT':''));
function team(el,t,phase,leading){
  const hasScore=phase!=='pregame'&&t.score!=null&&t.score!=='';
  const cls=phase==='pregame'?'lead':(leading===null?'lead':(leading?'lead':'trail'));
  el.innerHTML='<div class="who"><div class="rk">'+(t.rank?'No. '+esc(t.rank):'&nbsp;')+'</div><div class="nm '+cls+'">'+esc(t.name)+'</div>'+
   (t.record?'<div class="rec">'+esc(t.record)+'</div>':'')+'</div>'+(hasScore?'<div class="sc '+cls+'">'+esc(t.score)+'</div>':'');
}
function render(d){
  const phase=d.phase||'pregame', a=d.away, h=d.home;
  document.getElementById('tag').textContent=({pregame:'Pregame',halftime:'Halftime',final:'Final',live:'Live'})[phase]||phase;
  document.getElementById('kick').textContent=(d.kicker||'')+(d.note?' · '+d.note:'');
  const sa=Number(a.score), sh=Number(h.score), have=phase!=='pregame'&&isFinite(sa)&&isFinite(sh)&&a.score!=null&&h.score!=null;
  team(document.getElementById('t1'),a,phase,have?(sa===sh?null:sa>sh):null);
  team(document.getElementById('t2'),h,phase,have?(sa===sh?null:sh>sa):null);
  document.getElementById('vs').style.display=phase==='pregame'?'block':'none';
  const big=document.getElementById('big'), sub=document.getElementById('sub'), ls=document.getElementById('ls');
  const st=d.status||{};
  if(phase==='pregame'){ big.innerHTML=esc(d.kickoff)+' · <b>'+esc(d.network)+'</b>'; sub.textContent=d.date+' · '+d.venue+', '+d.city; }
  else if(phase==='halftime'){ big.innerHTML='Halftime'; sub.textContent=d.date+' · '+d.venue+' · '+d.network; }
  else if(phase==='final'){ big.innerHTML='Final'+(st.period>4?' · <b>'+ord(st.period)+'</b>':''); sub.textContent=d.date+' · '+d.venue+' · '+d.network; }
  else { big.innerHTML=(st.period?ord(st.period):'')+(st.clock?' · <b>'+esc(st.clock)+'</b>':''); sub.textContent=d.date+' · '+d.venue+' · '+d.network; }
  const la=(d.linescores||{}).away||[], lh=(d.linescores||{}).home||[];
  ls.innerHTML=(phase!=='pregame'&&la.length&&lh.length)?'<span>'+esc(a.name)+': '+la.map(esc).join(' · ')+'</span><span>'+esc(h.name)+': '+lh.map(esc).join(' · ')+'</span>':'';
  document.getElementById('src').textContent=phase==='pregame'?'Rankings and records: ESPN':'Scores: ESPN';
  fit();
}
/* Shrink any team name that would crowd the score so nothing overflows the 1080 canvas. */
function fit(){
  document.querySelectorAll('.team').forEach(row=>{
    const nm=row.querySelector('.nm'), sc=row.querySelector('.sc'); let fs=150;
    while(fs>60){ nm.style.fontSize=fs+'px'; const w=row.clientWidth-(sc?sc.offsetWidth+24:0); if(nm.scrollWidth<=w) break; fs-=4; }
  });
}
function scale(){ const s=Math.min(1,innerWidth/1080); const st=document.getElementById('stage'); st.style.transform=s<1?'scale('+s+')':''; document.body.style.height=s<1?(1350*s)+'px':''; document.documentElement.style.overflowX='hidden'; }
addEventListener('resize',scale); scale();
(async()=>{ try{
  let d=window.__SCORE__;
  if(!d){ const p=new URLSearchParams(location.search).get('data')||'scoreboard-2026-10-31-georgia.json'; d=await (await fetch(p)).json(); const ph=new URLSearchParams(location.search).get('phase'); if(ph) d.phase=ph; }
  await document.fonts.ready; render(d); document.body.dataset.ready='1';
}catch(e){ document.body.dataset.error=String(e); } })();
</script></body></html>
