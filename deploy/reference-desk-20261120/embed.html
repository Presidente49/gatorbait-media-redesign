<style id="gbm-ref-css">.gbm-ref{box-sizing:border-box;max-width:1240px;margin:0 auto;padding:22px 16px 18px;background:#fff;font-family:Barlow,Arial,sans-serif;color:#14243d;scroll-margin-top:120px;text-align:left}.gbm-ref *{box-sizing:border-box}.gbm-ref .k{margin:0 0 4px;font:800 13px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#d8450c}.gbm-ref h2{margin:0 0 8px;padding:0;font:800 34px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:0;text-transform:uppercase;color:#081b35}.gbm-ref h3{margin:22px 0 4px;padding:0 0 6px;border-bottom:3px solid #fa4616;font:800 20px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#081b35}.gbm-ref p{margin:0 0 8px;font-size:16px;line-height:1.45;color:#14243d}.gbm-ref .nx{padding:10px 12px;background:#fff4ee;border-left:4px solid #fa4616}.gbm-ref a{color:#0021a5;font-weight:700;text-decoration:underline}.gbm-ref table{width:100%;border-collapse:collapse;margin:10px 0 8px;font-size:16px;line-height:1.3}.gbm-ref td,.gbm-ref th{padding:10px 6px;border-bottom:1px solid #d5dce6;text-align:left;vertical-align:top}.gbm-ref th{font:800 12px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#5f6b7a}.gbm-ref td:first-child{white-space:nowrap;color:#5f6b7a;font-weight:600}.gbm-ref td:last-child,.gbm-ref th:last-child{text-align:right;font-weight:700}.gbm-ref tr.w td:last-child{color:#0a7a3b}.gbm-ref tr.l td:last-child{color:#b3261e}.gbm-ref tr.n td{background:#fff4ee;font-weight:700;color:#081b35}.gbm-ref .src{font-size:13px;color:#5f6b7a}.gbm-ref ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 22px}.gbm-ref li{margin:0;padding:9px 0;border-bottom:1px solid #e3e8ef;font-size:16px;line-height:1.3;color:#081b35;font-weight:700}.gbm-ref li b{display:inline-block;min-width:40px;color:#d8450c;font:800 18px/1 "Barlow Condensed",Barlow,sans-serif}.gbm-ref li span{display:block;padding-left:40px;font-size:14px;font-weight:500;color:#5f6b7a}#gbm-opp{scroll-margin-top:96px}@media(min-width:700px){.gbm-ref{padding-left:20px;padding-right:20px}}</style><script id="gbm-ref-v1">(function(){

g.opp=(c.neutralSite||me.homeAway==='home'?'vs. ':'at ')+(rk&&rk<=25?'No. '+rk+' ':'')+nm+(c.neutralSite&&c.venue&&c.venue.address?' ('+c.venue.address.city+')':'');

m=[(a.position||{}).abbreviation,YR[ex]||ex,[ht,a.displayWeight].filter(Boolean).join(', '),home].filter(Boolean).join(' · ');

function sec(id,html){var s=document.getElementById(id)||document.createElement('section');s.id=id;s.className='gbm-ref';s.innerHTML=html;return s}
function go(){var m={'#schedule':'gbm-sched','#roster':'gbm-rosterpage','#gbm-opp':'gbm-opp'}[location.hash],el=m&&document.getElementById(m);el&&el.scrollIntoView({block:'start'})}
function get(k,u){if(busy||D.f>4)return;busy=1;fetch(u).then(function(r){return r.json()}).then(function(j){D[k]=j;D[k+'t']=Date.now();busy=0;tick()}).catch(function(){busy=0;D.f++})}
