<script>

    // 1. Legacy post prefix - biggest bug for subscribers
    if (p.indexOf("/gatorbait-media-blogs/post/") === 0) {
      goReplace(p.replace("/gatorbait-media-blogs/post/", "/post/") + s + h); return;
    }
    // 2. /blog/ -> /post/
    if (/^\/blog\/[^/]+/.test(p)) {

    // 3. /category/{slug} and /categories/{slug} -> /gatorbait-media-blogs/categories/{slug}
    var mCat = p.match(/^\/categor(?:y|ies)\/(.+)$/);

      goReplace("/gatorbait-media-blogs/categories/" + catSlug + s + h); return;

    // Reader repair: author-name links lead to the native current-author feed, not a legacy tag archive.
    if ((p.replace(/\/+$/, "") || "/") === "/") {

          a.setAttribute("href", "/profile/franz/profile");
        });
      }
      repairFranzLinks();
      document.addEventListener("gbm:gazette-ready", repairFranzLinks);
    }

    // Native Wix owns post titles, descriptions, social tags and article schema.
    // Wait for its real post header; decorate the visible published date only.
    var isPost = p.indexOf("/post/") === 0;
    if (!isPost || p === '/post/denzel-aberdeen-florida-temporary-injunction-2026') return;
    var injected = false;
    function injectAll() {
      var titleNode=document.querySelector('[data-hook="post-page"] [data-hook="post-title"]');
      var postHeader=titleNode&&titleNode.closest('header'),rawDate=(document.querySelector('meta[property="article:published_time"]')||{}).content,date=new Date(rawDate||'');

        var line=document.createElement('p'),time=document.createElement('time');line.className='gbm-published';
        time.dateTime=date.toISOString();time.textContent=date.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'America/New_York'});
        line.appendChild(document.createTextNode('Published '));line.appendChild(time);postHeader.appendChild(line);
      }
      if (!titleNode || !postHeader || !rawDate || !Number.isFinite(date.getTime())) return false;
      injected = true;
      return true;
    }

    injectAll();

        });
