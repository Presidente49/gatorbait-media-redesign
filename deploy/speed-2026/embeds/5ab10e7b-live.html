<script>(function(){if(window.__gbmFBVC)return;window.__gbmFBVC=1;var p=location.pathname||'';if(p.indexOf('/post/')!==0)return;function go(n){if(typeof window.fbq!=='function'){if(n<25){setTimeout(function(){go(n+1);},400);}return;}var m=document.querySelector('meta[property="og:title"]');var t=(m&&m.getAttribute('content'))||document.title||'';var slug=p.split('/post/')[1]||p;try{window.fbq('track','ViewContent',{content_type:'article',content_name:t.slice(0,120),content_ids:[slug],content_category:'Florida Gators'});}catch(e){}}go(0);})();</script>
