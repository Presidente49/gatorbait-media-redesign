name: GatorBait production health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "automation/ops-hub/model-router/**"
      - "automation/ops-hub/controller-diagnostic.sh"
      - "automation/ops-hub/docker-compose.yml"
      - "automation/site_health_check.py"
      - ".github/workflows/gatorbait-production-health.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: gatorbait-production-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test controller model routing
        run: python3 automation/ops-hub/model-router/test_task_runner.py

  health:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test controller model routing
        run: python3 automation/ops-hub/model-router/test_task_runner.py

      - name: Check production routes and brand markers
        run: python3 automation/site_health_check.py
