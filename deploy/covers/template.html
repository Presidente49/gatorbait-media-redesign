<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GatorBait story cover</title>
<meta name="viewport" content="width=1600">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* GatorBait story cover, 1600x900. Rendered by the live-shots workflow (file:// in the runner) and imported to Wix.
   Query: photo=<wix media id> cutout=<wix media id> kicker= sub= title= dek= credit= focus=<css background-position> side=right (copy on the right when the subject is on the left) */
html,body{margin:0;background:#07122e}
.cover{position:relative;width:1600px;height:900px;overflow:hidden;background:#07122e;font-family:"Barlow",sans-serif;color:#fff}
.photo{position:absolute;inset:0;background-size:cover;background-position:var(--focus,50% 35%);filter:saturate(1.05) contrast(1.04)}
.wash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,18,46,.96) 0%,rgba(7,18,46,.82) 34%,rgba(7,18,46,.38) 62%,rgba(7,18,46,.12) 100%)}
.wash2{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,18,46,0) 45%,rgba(7,18,46,.85) 100%)}
.rings{position:absolute;inset:-10%;background:radial-gradient(60% 60% at 78% 62%,rgba(250,70,22,.22),rgba(250,70,22,0) 60%)}
.copy{position:absolute;left:84px;top:96px;width:860px;display:grid;gap:22px;align-content:start}
.kick{display:inline-flex;gap:14px;align-items:center;font:800 26px/1 "Barlow Condensed",sans-serif;letter-spacing:.22em;text-transform:uppercase}
.kick b{background:#fa4616;color:#fff;padding:9px 14px 8px;border-radius:2px}
.kick span{color:#c8d3ef}
h1{margin:0;font:800 96px/.96 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.005em;text-wrap:balance;max-width:820px;text-shadow:0 4px 30px rgba(0,0,0,.45)}
h1.long{font-size:82px}
h1.xlong{font-size:70px}
.dek{font:500 30px/1.3 "Barlow",sans-serif;color:#dfe6fb;max-width:720px}
.rule{width:150px;height:8px;background:#fa4616}
.cover.r .wash{background:linear-gradient(270deg,rgba(7,18,46,.96) 0%,rgba(7,18,46,.84) 40%,rgba(7,18,46,.30) 66%,rgba(7,18,46,.05) 100%)}
.cover.r .copy{left:auto;right:84px;width:800px}
.cover.r .kick{font-size:24px;letter-spacing:.12em}
.kick b,.kick span{white-space:nowrap}
.cover.r .rings{background:radial-gradient(60% 60% at 22% 62%,rgba(250,70,22,.22),rgba(250,70,22,0) 60%)}
.cutout{position:absolute;right:70px;bottom:0;height:96%;width:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.foot{position:absolute;left:84px;bottom:40px;display:grid;gap:10px;justify-items:start;max-width:760px}
.mark{font:800 34px/1 "Barlow Condensed",sans-serif;letter-spacing:.14em;text-transform:uppercase}
.mark i{font-style:normal;color:#fa4616}
.credit{font:600 19px/1.3 "Barlow",sans-serif;color:#c8d3ef;letter-spacing:.02em}
</style></head><body>
<div class="cover" id="cover">
  <div class="photo" id="photo"></div><div class="wash"></div><div class="wash2"></div><div class="rings"></div>
  <img class="cutout" id="cutout" alt="" hidden>
  <div class="copy"><p class="kick" id="kick" style="margin:0"></p><h1 id="title"></h1><div class="rule"></div><p class="dek" id="dek" style="margin:0"></p></div>
  <div class="foot"><div class="mark">Gator<i>Bait</i> Media</div><div class="credit" id="credit"></div></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search), W = 'https://static.wixstatic.com/media/';
  function esc(s) { return String(s || ''); }
  var photo = q.get('photo'); if (photo) document.getElementById('photo').style.backgroundImage = 'url("' + W + photo + '/v1/fill/w_1600,h_900,al_c,q_90/' + photo + '")';
  if (q.get('side') === 'right') document.getElementById('cover').classList.add('r');
  if (q.get('focus')) document.getElementById('photo').style.setProperty('--focus', q.get('focus'));
  var cut = q.get('cutout'); if (cut) { var c = document.getElementById('cutout'); c.src = W + cut; c.hidden = false; }
  var k = document.getElementById('kick'); k.innerHTML = '<b>' + esc(q.get('kicker') || 'GatorBait') + '</b>' + (q.get('sub') ? '<span>' + esc(q.get('sub')) + '</span>' : '');
  var t = q.get('title') || ''; var h = document.getElementById('title'); h.textContent = t; h.className = t.length > 70 ? 'xlong' : t.length > 46 ? 'long' : '';
  document.getElementById('dek').textContent = q.get('dek') || '';
  document.getElementById('credit').textContent = q.get('credit') || '';
  document.getElementById('cover').setAttribute('data-ready', '1');
})();
</script></body></html>
