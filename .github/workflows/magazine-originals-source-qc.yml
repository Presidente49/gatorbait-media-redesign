name: Magazine original source inventory QC

on:
  push:
    paths:
      - 'tools/magazine-originals/**'
      - '.gitmodules'
      - '.github/workflows/magazine-originals-source-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magazine-original-source-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source pins only
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify original source pins and licenses
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tools/magazine-originals/upstream/colorlib rev-parse HEAD)" = "3018557fe943fb1c3e3367aa52d39b2fca44f725"
          test "$(git -C tools/magazine-originals/upstream/zine rev-parse HEAD)" = "17285efe9f9a63b79a42a738b54d4d730b8cd551"
          test "$(git -C tools/magazine-originals/upstream/baoyu-design rev-parse HEAD)" = "6530033592bf7fa58bc1a5a2a2ad278da45213a9"
          test "$(git -C tools/magazine-originals/upstream/pagedjs rev-parse HEAD)" = "6b0ff8089f472a17247e44671da93d2d931e656e"
          test "$(git -C tools/magazine-originals/upstream/pagedjs-cli rev-parse HEAD)" = "1fc8c8956d665347a6a105c927be405a3ac462d6"
          test "$(git -C tools/magazine-originals/upstream/vivliostyle rev-parse HEAD)" = "94065673eb83619e5468d47461a609d6c9d7b6ee"
          test -f tools/magazine-originals/upstream/colorlib/LICENSE-MIT
          test -f tools/magazine-originals/upstream/zine/LICENSE
          test -f tools/magazine-originals/upstream/baoyu-design/LICENSE
          test -f tools/magazine-originals/upstream/pagedjs/LICENSE.md
          test -f tools/magazine-originals/upstream/pagedjs-cli/LICENSE
          test -f tools/magazine-originals/upstream/vivliostyle/LICENSE
          echo "Source inventory verified. No vendor build/install executed."

      - name: Enforce security-hold documentation
        run: |
          grep -q "SECURITY HOLD" tools/magazine-originals/RESULTS.md
          grep -q "Vivliostyle retains its AGPL-3.0 license" tools/magazine-originals/RESULTS.md
