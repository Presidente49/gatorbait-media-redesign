name: Magazine nav flash probe (read-only)
on:
  push:
    branches: ['probe/mag-nav-20261018']
    paths: ['probe-magnav/**','.github/workflows/probe-magnav-20261018.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Probe live /magazine paths (read-only, default TLS verification)
        run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          cp ../probe-magnav/run.js . && cat ../probe-magnav/tag.txt > /dev/null && T=$(cat ../probe-magnav/tag.txt); PROBE_TAG=$T ENGINE=webkit node run.js; mkdir -p wk && cp out/* wk/ && rm -rf out && mkdir out && PROBE_TAG=$T node run.js; mkdir -p out/webkit && cp wk/* out/webkit/
      - if: always()
        run: |
          TAG=$(cat probe-magnav/tag.txt)
          mkdir -p deploy/mag-nav-probe-20261018/$TAG && cp p/out/* deploy/mag-nav-probe-20261018/$TAG/ || true
          git config user.name probe-bot && git config user.email probe-bot@users.noreply.github.com
          git add deploy/mag-nav-probe-20261018 && git commit -m "probe output: magazine nav flash ($TAG)" && git pull --rebase origin probe/mag-nav-20261018 && git push origin HEAD:probe/mag-nav-20261018 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mag-nav-probe
          path: p/out
          retention-days: 7
