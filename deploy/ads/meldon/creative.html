<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- DRAFT render source for the MeldonLaw.com sponsor PNGs. Open as creative.html?s=1200x628 (or 1080x1080, 728x90, 320x100). -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#263a94;--ink:#10264b;--muted:#6b7894;--line:#d9dce6;--paper:#ffffff;--tint:#f4f6fc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
.ad{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Barlow,Arial,sans-serif;border:2px solid var(--line);display:flex}
.lbl{font:700 14px "Barlow Condensed",Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.logo{display:block;height:auto}
.cta{display:inline-block;background:var(--navy);color:#fff;font-weight:700;border-radius:999px;white-space:nowrap}
.areas{list-style:none;display:flex;flex-wrap:wrap}
.areas li{background:var(--tint);border:1px solid #dfe4f3;border-radius:6px;font-weight:600;color:var(--ink)}
.city{color:#4a5570;font-weight:500}
.bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--navy)}
/* 1200x628 */
.s1200x628{width:1200px;height:628px;flex-direction:column;justify-content:center;padding:56px 80px 56px 90px}
.s1200x628 .lbl{position:absolute;top:26px;left:90px}
.s1200x628 .logo{width:560px;margin-bottom:34px}
.s1200x628 .areas{gap:12px;margin-bottom:34px;max-width:1000px}
.s1200x628 .areas li{font-size:26px;padding:8px 16px}
.s1200x628 .foot{display:flex;align-items:center;gap:28px}
.s1200x628 .cta{font-size:32px;padding:16px 34px}
.s1200x628 .city{font-size:28px}
/* 1080x1080 */
.s1080x1080{width:1080px;height:1080px;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 80px}
.s1080x1080 .bar{right:0;bottom:auto;width:auto;height:12px}
.s1080x1080 .lbl{position:absolute;top:40px;left:0;right:0;font-size:18px}
.s1080x1080 .logo{width:720px;margin-bottom:60px}
.s1080x1080 .areas{justify-content:center;gap:14px;margin-bottom:56px}
.s1080x1080 .areas li{font-size:32px;padding:10px 20px}
.s1080x1080 .city{font-size:34px;margin-bottom:34px}
.s1080x1080 .cta{font-size:40px;padding:20px 46px}
/* 728x90 */
.s728x90{width:728px;height:90px;align-items:center;gap:18px;padding:0 16px 0 22px}
.s728x90 .bar{width:6px}
.s728x90 .lbl{position:absolute;top:4px;right:10px;font-size:9px;letter-spacing:.18em}
.s728x90 .logo{width:180px;flex:none}
.s728x90 .mid{flex:1;font-size:14px;line-height:1.3;font-weight:600;white-space:nowrap}
.s728x90 .mid .city{display:block;font-size:13px}
.s728x90 .cta{font-size:15px;padding:9px 16px;margin-top:8px}
/* 320x100 */
.s320x100{width:320px;height:100px;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 12px 10px 16px}
.s320x100 .bar{width:5px}
.s320x100 .lbl{position:absolute;top:4px;right:8px;font-size:8px;letter-spacing:.16em}
.s320x100 .logo{width:200px}
.s320x100 .cta{font-size:13px;padding:6px 14px}
</style></head>
<body>
<div id="root"></div>
<script>
const s = new URLSearchParams(location.search).get('s') || '1200x628';
const logo = '../../../assets/ads/meldon/logo/ml_official-logo.svg';
const all = ['Personal Injury','Car Accident','Motorcycle Accident','Truck Accident','Pedestrian Accident','Dog Bite','Slip &amp; Fall','Premises Liability','Wrongful Death'];
const li = (a) => '<ul class="areas">' + a.map((x) => '<li>' + x + '</li>').join('') + '</ul>';
const lbl = '<p class="lbl">Advertisement</p>', bar = '<span class="bar"></span>', img = '<img class="logo" src="' + logo + '" alt="Meldon Law">';
const cta = '<span class="cta">Visit MeldonLaw.com</span>';
const T = {
  '1200x628': bar + lbl + img + li(all) + '<div class="foot">' + cta + '<span class="city">Gainesville, FL</span></div>',
  '1080x1080': bar + lbl + img + li(all) + '<p class="city">Gainesville, FL</p>' + cta,
  '728x90': bar + lbl + img + '<div class="mid">Personal Injury · Car Accident · Truck Accident<span class="city">Gainesville, FL</span></div>' + cta,
  '320x100': bar + lbl + img + cta,
};
document.getElementById('root').innerHTML = '<div class="ad s' + s + '" id="ad">' + T[s] + '</div>';
</script>
</body></html>
