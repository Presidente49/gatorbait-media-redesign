name: GatorBait Magazine Newsletter Stack QC

on:
  push:
    paths:
      - 'newsletter/**'
      - 'automation/newsletter/**'
      - 'docs/GATORBAIT-PUBLISHING-EMAIL-PLAYBOOK.md'
      - 'automation/ops-hub/playbooks/email-template-library.md'
      - 'skills/master-control/SKILL.md'
      - 'automation/ops-hub/policy.json'
      - 'tools/fetch-pinned-sources.sh'
      - '.github/workflows/newsletter-stack-qc.yml'
  pull_request:
    paths:
      - 'newsletter/**'
      - 'automation/newsletter/**'
      - '.github/workflows/newsletter-stack-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsletter-stack-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newsletter-qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the pinned Colorlib library
        run: tools/fetch-pinned-sources.sh newsletter

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pinned Colorlib source
        run: |
          test -f vendor/colorlib-email-templates/LICENSE-MIT
          test -f vendor/colorlib-email-templates/src/24.mjml
          test -f vendor/colorlib-email-templates/src/4.mjml
          test "$(git -C vendor/colorlib-email-templates rev-parse HEAD)" = "3018557fe943fb1c3e3367aa52d39b2fca44f725"

      - name: Install upstream MJML toolchain
        run: npm ci --prefix vendor/colorlib-email-templates

      - name: Render and validate synthetic issue data
        env:
          MJML_MODULE: ${{ github.workspace }}/vendor/colorlib-email-templates/node_modules/mjml/lib/index.js
        run: |
          node --test automation/newsletter/build-magazine.test.mjs
          node automation/newsletter/build-magazine.mjs \
            --json newsletter/templates/gatorbait-magazine-synthetic.json \
            --out /tmp/gatorbait-magazine-synthetic --synthetic
          node automation/newsletter/validate-unique-images.mjs /tmp/gatorbait-magazine-synthetic/magazine.mjml
          node automation/newsletter/run-stack-qc.mjs /tmp/gatorbait-magazine-synthetic/magazine.mjml automation/newsletter/synthetic-policy.json
          node automation/newsletter/check-links.mjs /tmp/gatorbait-magazine-synthetic/magazine.mjml
          node automation/newsletter/check-links.mjs --rendered /tmp/gatorbait-magazine-synthetic/magazine.html

      - name: Render offline mobile and desktop proofs
        run: |
          google-chrome --version
          node automation/newsletter/render-preview.mjs \
            /tmp/gatorbait-magazine-synthetic/magazine.html /tmp/gatorbait-magazine-synthetic --synthetic

      - name: Save synthetic preview and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gatorbait-magazine-synthetic-preview
          path: |
            /tmp/gatorbait-magazine-synthetic/magazine.html
            /tmp/gatorbait-magazine-synthetic/preview-*.jpg
            /tmp/gatorbait-magazine-synthetic/preview-report.json
          if-no-files-found: error
