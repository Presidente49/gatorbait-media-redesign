name: Refresh GatorBait publication feeds

on:
  push:
    # The PR branch runs only the stats build: push deploy/wix-served/florida-stats.request to
    # get a free ESPN read and a committed snapshot (this session cannot dispatch workflows).
    branches: [main, claude/tender-wozniak-rmp60e]
    paths:
      - 'deploy/wix-served/florida-stats.request'
      - 'automation/update_newsroom_feed.py'
      - 'automation/update_newsroom_feed_routed.py'
      - 'newsroom-preview/editorial-routing.json'
      - '.github/workflows/refresh-newsroom-feed.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-newsroom-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh both presentations from one public Wix feed read
        if: github.ref == 'refs/heads/main'
        run: python automation/update_newsroom_feed_routed.py
      # Branch-only diagnostic: which ESPN hosts and User-Agents answer this runner, and does
      # ESPN send CORS headers a reader's browser could use? Log only; never blocks anything.
      - name: Probe ESPN access from this runner
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: |
          P=sports/football/college-football
          CHROME='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          for host in site.api.espn.com site.web.api.espn.com; do
            for ua in 'GatorBait-Stats/1 (+https://www.gatorbaitmedia.com)' "$CHROME" 'Python-urllib/3.12'; do
              code=$(curl -s -o /dev/null -w '%{http_code} bytes=%{size_download}' -A "$ua" "https://$host/apis/site/v2/$P/teams/57/schedule?season=2026&seasontype=2")
              echo "schedule $host [$ua] -> $code"
            done
          done
          for u in "teams/57" "scoreboard?groups=8" "summary?event=401856708"; do
            echo "== CORS $u"
            curl -s -D - -o /dev/null -w 'bytes=%{size_download}\n' -A "$CHROME" -H 'Origin: https://www.gatorbaitmedia.com' "https://site.api.espn.com/apis/site/v2/$P/$u" \
              | grep -i -E '^(HTTP/|access-control-allow-origin|cache-control|server|x-cache|bytes=)' || true
          done
          curl -s https://api.ipify.org && echo ' (runner IP)' || true
      # Florida football stats: reads ESPN only in a game window, hourly for 3 days after a final,
      # and once a day; otherwise a no-op. A failed read or check keeps the last good snapshot
      # and never blocks the newsroom refresh.
      - name: Refresh Florida football stats from ESPN box scores
        continue-on-error: true
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && '--force' || '' }}
        run: |
          python -m unittest -q automation/tests/test_florida_stats.py
          python automation/florida_stats.py $FORCE
      - name: Commit changed content and request the existing Pages publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CHANGED=false
          STATS=false
          git config user.name 'gatorbait-newsroom-bot'
          git config user.email 'brenden@gatorbaitmedia.com'
          if ! git diff --quiet -- newsroom-preview/data/posts.json newsroom-preview/index.html gazette-live/posts.json; then
            git add newsroom-preview/data/posts.json newsroom-preview/index.html gazette-live/posts.json
            git commit -m 'data: refresh current Newsroom and Gazette stories'
            CHANGED=true
          fi
          if [ -n "$(git status --porcelain -- deploy/wix-served/florida-stats.json deploy/wix-served/florida-stats.html)" ]; then
            git add deploy/wix-served/florida-stats.json deploy/wix-served/florida-stats.html
            git commit -m 'data: refresh Florida football stats from ESPN box scores'
            STATS=true
          fi
          if [ "$CHANGED" = true ] || [ "$STATS" = true ]; then
            git push
          fi
          # GITHUB_TOKEN commits do not trigger branch-based Pages automatically.
          # Ask the SAME native publisher to publish; no second artifact root.
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$CHANGED" = true ] || [ "$EVENT_NAME" = push ]; }; then
            gh api --method POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/pages/builds"
          else
            echo 'No publication content changed. No deployment requested.'
          fi
