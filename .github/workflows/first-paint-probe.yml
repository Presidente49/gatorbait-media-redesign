name: GatorBait first-paint probe

on:
  push:
    paths:
      - 'automation/vision/first-paint.mjs'
      - 'deploy/wix-served/**'
      - '.github/workflows/first-paint-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: first-paint-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-paint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1 web-vitals@4.2.4
          npx playwright install --with-deps chromium
      - name: Probe live first paint
        run: node automation/vision/first-paint.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatorbait-first-paint
          path: build/first-paint
          if-no-files-found: ignore
