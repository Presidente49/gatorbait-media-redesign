services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - gatorbait_n8n_data:/home/node/.n8n
      # File-queue bridge to the host-side Claude/Codex worker. No model credentials
      # or host binaries are mounted into n8n. n8n may write job JSON to /jobs/inbox
      # and read completed result JSON from /jobs/done or /jobs/failed.
      - ./.state/model-jobs:/jobs

volumes:
  gatorbait_n8n_data:
