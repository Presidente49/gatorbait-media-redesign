<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b1c;width:1200px}

.brand p{font:700 20px/1.25 'Barlow',Arial,sans-serif;margin-top:8px;position:relative}
.brand small{font:600 15px/1.2 'Barlow',Arial,sans-serif;margin-top:8px;color:#a9b3d3;position:relative;display:block}
