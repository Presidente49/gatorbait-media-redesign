name: ESPN probe (one-off, read-only)
on:
  push:
    branches:
      - 'probe/espn-20261017'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load the live homepage like a reader and log what the card fetches
        run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > run.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1366, height: 900 } });
            p.on('console', m => { if (/error|fail|espn|gbm/i.test(m.text())) console.log('CONSOLE', m.type(), m.text().slice(0, 200)); });
            p.on('requestfailed', r => { if (/espn|scoreboard|github\.io|jsdelivr/.test(r.url())) console.log('REQFAIL', r.url().slice(0, 140), r.failure() && r.failure().errorText); });
            p.on('response', r => { if (/espn|scoreboard\.json|jsdelivr|blog-feed/.test(r.url())) console.log('RESP', r.status(), r.url().slice(0, 150)); });
            p.on('response', r => { if (/site\.web\.api\.espn\.com/.test(r.url())) r.text().then(t => { try { const j = JSON.parse(t); const ev = (j.events || []).filter(e => /401856724/.test(e.id)); console.log('ESPN_EVENTS', (j.events || []).length, JSON.stringify(ev.map(e => ({ id: e.id, st: e.status && e.status.type && [e.status.type.name, e.status.type.state, e.status.type.detail], clock: e.status && e.status.displayClock, per: e.status && e.status.period, teams: (e.competitions[0].competitors || []).map(c => [c.id, c.score, (c.linescores || []).map(l => l.value)]) })))); } catch (x) { console.log('ESPN_PARSE_ERR', String(x).slice(0, 100), t.slice(0, 150)); } }).catch(x => console.log('ESPN_TEXT_ERR', String(x).slice(0, 100))); });
            console.log('PROBE_AT', new Date().toISOString());
            await p.goto('https://www.gatorbaitmedia.com/?v=probe' + Date.now(), { waitUntil: 'load' });
            await p.waitForTimeout(12000);
            const t = await p.evaluate(() => { const n = document.querySelector('.bc-nx'); return n ? n.innerText.replace(/\\s+/g, ' ').slice(0, 400) : 'NO CARD'; });
            console.log('CARD:', t);
            const lead = await p.evaluate(() => { const h = document.querySelector('.sh-lead h1'); return h ? h.innerText : 'NO LEAD'; });
            console.log('LEAD:', lead);
            await p.screenshot({ path: 'card.png', clip: { x: 0, y: 220, width: 1366, height: 260 } });
            await b.close();
          })();
          JS
          node run.js
      - uses: actions/upload-artifact@v4
        with:
          name: card
          path: p/card.png
