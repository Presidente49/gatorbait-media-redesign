<style id="gbm-gameday-css">
#gbm-gd{position:relative;margin:14px 0 24px;padding:16px 22px 20px;background:#081b35;color:#fff;border-top:5px solid #fa4616;overflow:hidden}

#gbm-gd .gd-pill{background:#fa4616;color:#fff;padding:5px 10px;letter-spacing:.16em;font-weight:900}
#gbm-gd .gd-board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:16px 0 16px}
#gbm-gd .gd-team{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;padding-left:12px;border-left:5px solid #ce1126}

#gbm-gd .gd-note{margin:0;font:500 15px/1.5 Barlow,sans-serif;color:#d5dfec}
#gbm-gd .gd-ups{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid rgba(255,255,255,.18)}
#gbm-gd .gd-ups li{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font:500 14px/1.45 Barlow,sans-serif;color:#e6edf6}
#gbm-gd .gd-ups b{color:#ff9a6b;margin-right:8px;letter-spacing:.06em}
#gbm-gd .gd-st{width:100%;margin-top:12px;border-collapse:collapse;font:800 15px/1.2 Barlow,sans-serif;font-variant-numeric:tabular-nums}#gbm-gd .gd-st td,#gbm-gd .gd-st th{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12);text-align:center;background:none}#gbm-gd .gd-st td{width:28%;color:#fff}#gbm-gd .gd-st th{font:700 11px/1.2 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#aebbd0}#gbm-gd .gd-ld{margin:10px 0 0;font:600 13px/1.45 Barlow,sans-serif;color:#d5dfec}
#gbm-gd .gd-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
#gbm-gd .gd-links a,#gbm-gd .gd-rbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;background:#fa4616;color:#fff!important;font:800 12px/1 Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none!important}
#gbm-gd .gd-links .gd-rbtn{background:#fff;color:#081b35!important;border:0;border-radius:0;margin:0;appearance:none;cursor:pointer}
#gbm-gd .gd-links .gd-rbtn+a{background:#fa4616;box-shadow:none}
#gbm-gd .gd-links a+a{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
@media(max-width:820px){#gbm-gd{margin:0 -18px 20px;padding:14px 18px 18px}}
@media(max-width:600px){#gbm-gd .gd-board{grid-template-columns:1fr;gap:10px}
#gbm-gd .gd-home{flex-direction:row;text-align:left;padding:0 0 0 12px;border-right:0;border-left:5px solid #fa4616}
#gbm-gd .gd-name{font-size:24px}#gbm-gd .gd-sub{font-size:12px;margin-top:4px}#gbm-gd .gd-score{font-size:34px}
#gbm-gd .gd-mid{display:flex;align-items:center;gap:10px;text-align:left;order:3}#gbm-gd .gd-venue{margin:0}
#gbm-gd .gd-status{min-width:0;font-size:13px;padding:7px 10px}#gbm-gd .gd-head{font-size:21px!important}#gbm-gd .gd-note{font-size:14px}
#gbm-gd .gd-links a,#gbm-gd .gd-rbtn{flex:1 1 auto;padding:0 10px}}
@media(max-width:360px){#gbm-gd{margin-inline:-14px;padding-inline:14px}#gbm-gd .gd-name{font-size:21px}#gbm-gd .gd-venue{display:none}}
@media(prefers-reduced-motion:no-preference){#gbm-gd .gd-status[data-state=live]:before{content:"";display:inline-block;width:8px;height:8px;margin:0 7px 1px 0;border-radius:50%;background:#fff;animation:gbmgd 1.4s infinite}@keyframes gbmgd{50%{opacity:.2}}}
