name: Public artifact privacy QC

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Synthetic privacy and guarded PATCH tests
        run: python3 -m unittest automation.operations.test_public_boundary automation.operations.test_private_patch
      - name: Validate current artifact paths
        run: python3 automation/operations/public-boundary.py --artifact-root .
      - name: Reject newly tracked private paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | head -n 1)"
          fi
          python3 automation/operations/public-boundary.py --changed-from "$base"

# Advisory validation only. Native branch-root Pages publishing does not wait
# for this job; changing Pages settings or required checks needs owner approval.
