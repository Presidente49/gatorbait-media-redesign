name: Magazine issue build

# The agent session cannot reach gatorbaitmedia.com or the Wix image CDN; a
# runner can. This job pulls full article bodies from the public blog feed and
# renders the issue, so the whole pipeline is reproducible from the repo.

on:
  push:
    paths:
      - 'magazine/**'
      - '.github/workflows/magazine-issue.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magazine-issue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept as a standing check on a route that does not currently work: if
      # Wix ever starts publishing content:encoded, this stops failing and the
      # build cache could come straight from the feed. Not a build gate.
      - name: Probe the public feed for full bodies
        continue-on-error: true
        run: python3 magazine/fetch_feed.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: npm i -D playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: Build the issue
        run: python3 magazine/build_issue.py magazine/issues/2026-09-26-ole-miss

      - name: Render the issue to PDF
        run: node magazine/render.mjs magazine/issues/2026-09-26-ole-miss

      - name: Commit the build cache
        shell: bash
        run: |
          git add magazine/build-cache magazine/issues
          if git diff --cached --quiet -- magazine/build-cache magazine/issues; then
            echo 'Feed unchanged.'
            exit 0
          fi
          git config user.name 'gatorbait-magazine-bot'
          git config user.email 'brenden@gatorbaitmedia.com'
          git commit -m 'magazine: rebuild issue and refresh build cache'
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            git fetch origin ${{ github.ref_name }}
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload the build cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magazine-issue
          path: |
            magazine/build-cache
            magazine/issues
          if-no-files-found: ignore
