name: Stale story probe (read-only)
on:
  push:
    branches: ['probe/stale-20261018']
    paths: ['probe-stale/**','.github/workflows/probe-stale-20261018.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp ../probe-stale/* . && node run.js
      - if: always()
        run: |
          mkdir -p deploy/stale-probe2-20261018 && cp p/out/* deploy/stale-probe2-20261018/ || true
          git config user.name probe-bot && git config user.email probe-bot@users.noreply.github.com
          git add deploy/stale-probe2-20261018 && git commit -m "probe output: stale story dump" && git push origin HEAD:probe/stale-20261018 || true
