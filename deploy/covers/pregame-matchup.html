<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1200">
<title>GatorBait matchup graphic: Florida at Missouri</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b1c;width:1200px}
#m{position:relative;width:1200px;height:760px;overflow:hidden;background:#060b1c;font-family:'Barlow',Arial,sans-serif;color:#fff}
/* two team fields split on a diagonal */
.uf{position:absolute;inset:0;background:linear-gradient(135deg,#0a2ca8 0%,#0021a5 45%,#04186e 100%);clip-path:polygon(0 0,58% 0,42% 100%,0 100%)}
.uf::after{content:"";position:absolute;inset:0;background:url("https://static.wixstatic.com/media/16b519_a0e407bedc46487ca71033fc8351d0fe~mv2.jpg") 30% 40%/cover no-repeat;opacity:.22;mix-blend-mode:luminosity}
.mu{position:absolute;inset:0;background:linear-gradient(225deg,#1a1a1a 0%,#000 55%,#0b0b0b 100%);clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%)}
.seam{position:absolute;left:0;top:0;width:1200px;height:760px;background:linear-gradient(90deg,transparent);clip-path:polygon(57% 0,59.4% 0,43.4% 100%,41% 100%);background:#fa4616}
.seam2{position:absolute;left:0;top:0;width:1200px;height:760px;clip-path:polygon(59.4% 0,60.4% 0,44.4% 100%,43.4% 100%);background:#f1b82d}
/* layered ghost type */
.g{position:absolute;font:800 300px/0.8 'Barlow Condensed',Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:2px;white-space:nowrap;color:transparent}
.g1{left:-30px;top:330px;-webkit-text-stroke:3px rgba(250,70,22,.55)}
.g2{right:-40px;top:40px;-webkit-text-stroke:3px rgba(241,184,45,.5)}
/* team blocks */
.t{position:absolute;z-index:3}
.t .rank{font:800 46px/1 'Barlow Condensed',Arial Narrow,sans-serif;letter-spacing:6px;text-transform:uppercase}
.t .name{font:800 150px/0.86 'Barlow Condensed',Arial Narrow,sans-serif;text-transform:uppercase;letter-spacing:-1px;text-shadow:0 8px 30px rgba(0,0,0,.5)}
.t .rec{font:700 40px/1.1 'Barlow Condensed',Arial Narrow,sans-serif;letter-spacing:3px;text-transform:uppercase;margin-top:12px}
.t.a{left:60px;top:150px}
.t.a .rank{color:#fa4616}.t.a .rec{color:#dce4ff}
.t.b{right:60px;top:380px;text-align:right}
.t.b .rank{color:#f1b82d}.t.b .name{color:#fff}.t.b .rec{color:#e9d9a8}
.at{position:absolute;left:600px;top:372px;transform:translate(-50%,-50%);z-index:4;width:132px;height:132px;border-radius:50%;background:#fff;color:#060b1c;display:flex;align-items:center;justify-content:center;font:800 64px/1 'Barlow Condensed',Arial Narrow,sans-serif;text-transform:uppercase;box-shadow:0 0 0 10px rgba(255,255,255,.18),0 12px 40px rgba(0,0,0,.55)}
/* top + bottom bars */
.top{position:absolute;left:0;right:0;top:0;height:92px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:linear-gradient(180deg,rgba(6,11,28,.85),rgba(6,11,28,0))}
.top img{height:58px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.top span{font:800 30px/1 'Barlow Condensed',Arial Narrow,sans-serif;letter-spacing:6px;text-transform:uppercase;color:#fff}
.bar{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:5;background:#060b1c;border-top:6px solid #fa4616;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.bar .k{font:800 40px/1 'Barlow Condensed',Arial Narrow,sans-serif;letter-spacing:4px;text-transform:uppercase}
.bar .k small{display:block;font:600 22px/1.3 'Barlow',Arial,sans-serif;letter-spacing:0;text-transform:none;color:#a9b3d3;margin-top:6px}
.bar .odds{display:flex;gap:14px}
.bar .odds div{border:3px solid #24315e;background:#111b3d;padding:10px 18px;text-align:center;font:800 34px/1 'Barlow Condensed',Arial Narrow,sans-serif;letter-spacing:2px}
.bar .odds div small{display:block;font:700 18px/1 'Barlow Condensed',Arial Narrow,sans-serif;letter-spacing:4px;color:#fa4616;margin-bottom:6px}
</style></head><body>
<div id="m">
  <div class="uf"></div><div class="mu"></div><div class="seam"></div><div class="seam2"></div>
  <div class="g g1">Gators</div><div class="g g2">Tigers</div>
  <div class="top"><img src="https://static.wixstatic.com/media/d3cfa5_95dd8a25863b4556b7ba6398fcfd0316~mv2.webp" alt="GatorBait"><span>Week 5 · SEC</span></div>
  <div class="t a"><div class="rank">No. 8</div><div class="name">Florida</div><div class="rec">4-0 · 2-0 SEC</div></div>
  <div class="at">at</div>
  <div class="t b"><div class="rank">No. 25</div><div class="name">Missouri</div><div class="rec">3-1 · 0-1 SEC</div></div>
  <div class="bar"><div class="k">Saturday, Oct. 3 · 3:30 p.m. ET · ABC<small>Memorial Stadium (Faurot Field), Columbia, Mo.</small></div>
    <div class="odds"><div><small>Line</small>FLA -5.5</div><div><small>Total</small>57.5</div></div></div>
</div>
</body></html>
