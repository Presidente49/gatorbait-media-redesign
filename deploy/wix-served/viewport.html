<style id="gbm-viewport-wide-v1">
html.gbm-native-wide body{overflow-x:hidden!important}
html.gbm-native-wide #SITE_PAGES,html.gbm-native-wide #PAGES_CONTAINER{max-width:100vw!important;overflow-x:hidden!important}
</style>
<script id="gbm-viewport-v1">(function(){
if(window.__GBM_VIEWPORT_V1__)return;window.__GBM_VIEWPORT_V1__=1;
// Wix Classic mobile forces width=320 and scales its fixed 320px canvas. Our homepage,
// Magazine and article pages are responsive, so they use the phone's real width. Other
// native Wix flows (forms, checkout, pricing) are unverified at real width, so they keep 320.
// html.gbm-native-wide is a defensive overflow clamp (same technique already proven on the
// account/sign-in pages) in case any fixed-width element resists the wider layout.
var WIDE='width=device-width, initial-scale=1, viewport-fit=cover',native=null;
function own(){var p=(location.pathname||'/').replace(/\/+$/,'')||'/';return p==='/'||p==='/magazine'||p.indexOf('/post/')===0;}
function sync(){var m=document.querySelector('meta[name="viewport"]');if(!m)return;var c=m.getAttribute('content');if(c!==WIDE)native=c;var want=own()?WIDE:native;if(want&&c!==want)m.setAttribute('content',want);document.documentElement.classList.toggle('gbm-native-wide',own()&&(location.pathname||'/').indexOf('/post/')===0);}
if(!window.__GBM_ROUTE_WATCH__){window.__GBM_ROUTE_WATCH__=1;['pushState','replaceState'].forEach(function(k){var orig=history[k];if(typeof orig!=='function')return;history[k]=function(){var r=orig.apply(this,arguments);try{window.dispatchEvent(new Event('gbmroutechange'));}catch(e){}return r;};});}
sync();
new MutationObserver(sync).observe(document.head,{subtree:true,childList:true,attributes:true,attributeFilter:['content']});
window.addEventListener('popstate',sync);window.addEventListener('gbmroutechange',sync);
})();</script>
