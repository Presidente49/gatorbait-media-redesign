name: ESPN probe (one-off, read-only)
on:
  push:
    branches:
      - 'probe/espn-20261017'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load the live homepage like a reader and log what the card fetches
        run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > run.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage({ viewport: { width: 1366, height: 900 } });
            p.on('console', m => { if (/error|fail|espn|gbm/i.test(m.text())) console.log('CONSOLE', m.type(), m.text().slice(0, 200)); });
            p.on('requestfailed', r => { if (/espn|scoreboard|github\.io|jsdelivr/.test(r.url())) console.log('REQFAIL', r.url().slice(0, 140), r.failure() && r.failure().errorText); });
            p.on('response', r => { if (/espn|scoreboard\.json|jsdelivr|blog-feed/.test(r.url())) console.log('RESP', r.status(), r.url().slice(0, 150)); });
            await p.goto('https://www.gatorbaitmedia.com/?v=probe' + Date.now(), { waitUntil: 'load' });
            await p.waitForTimeout(4000);
            const cands = [
              'https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=8&dates=20261017',
              'https://cdn.espn.com/core/college-football/scoreboard?xhr=1&render=false&groupId=8&dates=20261017',
              'https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=401856724',
              'https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=401856724',
              'https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/events/401856724/competitions/401856724/competitors/57/linescores',
              'https://presidente49.github.io/gatorbait-media-redesign/sports-live/scoreboard.json'
            ];
            const r = await p.evaluate(async (cands) => {
              const out = {};
              for (const u of cands) {
                try {
                  const x = await fetch(u + (u.includes('?') ? '&' : '?') + '_=' + Date.now(), { credentials: 'omit' });
                  const t = await x.text();
                  out[u.slice(8, 80)] = 'OK ' + x.status + ' len=' + t.length + ' ' + t.slice(0, 60).replace(/\s+/g, ' ');
                } catch (err) { out[u.slice(8, 80)] = 'FAIL ' + String(err).slice(0, 50); }
              }
              return out;
            }, cands);
            console.log('FETCH TESTS', JSON.stringify(r, null, 1));
            await b.close();
          })();
          JS
          node run.js
