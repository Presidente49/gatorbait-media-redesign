name: Reader support preview checks
on:
  pull_request:
    paths:
      - 'support/**'
      - 'deploy/reader-support/**'
      - '.github/workflows/reader-support-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: python3 deploy/reader-support/build-preview.py && git diff --exit-code support/standalone.html
      - run: node deploy/reader-support/preview-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-support-preview
          path: build/reader-support
          if-no-files-found: error
