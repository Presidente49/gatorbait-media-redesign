<style id="gbm-liveband-css">#gbm-liveband{position:relative;z-index:30;background:#10264b;color:#fff;border-bottom:3px solid #fa4616;font:600 15px/1.2 Barlow,Arial,sans-serif}#gbm-liveband *{box-sizing:border-box}#gbm-liveband .lb{max-width:1320px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}#gbm-liveband .lb-mark{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}#gbm-liveband .lb-logo{position:relative;display:block;width:96px;height:54px;overflow:hidden;background:#fff;border-radius:3px;flex:0 0 auto}#gbm-liveband .lb-logo img{position:absolute;left:-19px;top:-1px;width:136px;max-width:none;height:auto;display:block}#gbm-liveband .lb-mark small{display:block;font:800 17px/1.05 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#ffb08f}#gbm-liveband .lb-st{display:inline-flex;align-items:center;gap:8px;font:800 14px/1 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ffb08f}#gbm-liveband .lb-st i{width:9px;height:9px;border-radius:50%;background:#9aa5b8}#gbm-liveband .on i,#gbm-liveband .soon i{background:#fa4616;box-shadow:0 0 0 4px #fa461640}#gbm-liveband .lb-tx{flex:1 1 220px;min-width:0;font:500 16px/1.25 Barlow,sans-serif;color:#dce4f2}#gbm-liveband .lb-tx b{color:#fff;font-weight:700}#gbm-liveband .lb-go{margin-left:auto;display:inline-flex;align-items:center;min-height:40px;padding:0 18px;background:#fa4616;color:#10264b;text-decoration:none;font:800 15px "Barlow Condensed",Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase}#gbm-liveband a:focus-visible{outline:3px solid #fff;outline-offset:2px}@media(max-width:700px){#gbm-liveband .lb{padding:7px 12px;gap:6px 10px;flex-wrap:nowrap}#gbm-liveband .lb-tx{display:none}#gbm-liveband .lb-logo{width:72px;height:40px}#gbm-liveband .lb-logo img{left:-14px;top:-1px;width:100px}#gbm-liveband .lb-mark{gap:9px;flex:0 0 auto}#gbm-liveband .lb-mark small{font-size:13px; <script id="gbm-liveband-js">(function(){
if(window.__GBM_LB__)return;window.__GBM_LB__=1;
var CH='https://www.youtube.com/@TheBuddyMartinShow/live';
function et(){var o={},p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',minute:'numeric',hour12:false}).formatToParts(new Date());p.forEach(function(x){o[x.type]=x.value});return{wd:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(o.weekday),m:(parseInt(o.hour,10)%24)*60+parseInt(o.minute,10)}}
function st(){var t=et(),s=t.wd>=1&&t.wd<=4;
if(s&&t.m>=1260&&t.m<1320)return['on','On air now','<b>Live now on YouTube.</b> Join Buddy and the show.'];
if(s&&t.m<1260)return['soon','Live tonight','<b>Tonight at 9 p.m. ET.</b> Live on YouTube, Monday through Thursday.'];
return['off','Next show '+((t.wd>=4||t.wd===0)?'Monday':'tomorrow'),'<b>9 p.m. ET.</b> Live on YouTube, Monday through Thursday.']}
function build(){var s=st(),d=document.createElement('div');d.id='gbm-liveband';d.setAttribute('role','region');d.setAttribute('aria-label','The Buddy Martin Show live schedule');
d.innerHTML='<div class="lb"><a class="lb-mark" href="/the-buddy-martin-show" aria-label="The Buddy Martin Show, live Monday through Thursday at 9 p.m. ET"><span class="lb-logo"><img src="https://static.wixstatic.com/media/d3cfa5_db06a79d17c64cdc8613af61c86ce1ed~mv2.jpg" width="148" height="61" alt="The Buddy Martin Show" decoding="async"></span><small>Live Mon&ndash;Thu<br>9 p.m. ET</small></a><span class="lb-st '+s[0]+'"><i></i>'+s[1]+'</span><span class="lb-tx">'+s[2]+'</span><a class="lb-go" href="'+CH+'">'+(s[0]==='on'?'Watch now':'Watch live')+'</a></div>';return d}
function mount(){var a=document.getElementById('gbm-mobile-shell-host')||document.getElementById('gbm-site-header');if(!a||a.parentNode!==document.body)return;
var o=document.getElementById('gbm-liveband');if(o&&o.previousElementSibling===a)return;if(o)o.remove();a.parentNode.insertBefore(build(),a.nextSibling)}
mount();var n=0,iv=setInterval(function(){mount();if(++n>40)clearInterval(iv)},500);
try{new MutationObserver(function(){if(!document.getElementById('gbm-liveband'))mount()}).observe(document.body,{childList:true})}catch(e){}
setInterval(function(){var o=document.getElementById('gbm-liveband');if(o){o.remove();mount()}},60000);
window.addEventListener('gbmroutechange',mount);window.addEventListener('popstate',function(){setTimeout(mount,50)});
var HD='https://site.web.api.espn.com/apis/v2/scoreboard/header?',LS=null;
function tn(c){return(c.rank&&c.rank<=25?'No. '+c.rank+' ':'')+(c.name||c.displayName)}
function one(sp,lg){return fetch(HD+'sport='+sp+'&league='+lg,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var out=null;((d.sports||[])[0]&&d.sports[0].leagues||[]).forEach(function(l){(l.events||[]).forEach(function(e){var f=(e.competitors||[]).filter(function(c){return String(c.id)==='57'})[0];if(!f)return;var age=Date.now()-new Date(e.date).getTime();if(e.status==='in'||(e.status==='post'&&age>0&&age<216e5)){var o=e.competitors.filter(function(c){return c!==f})[0];if(o&&f.score!=null&&o.score!=null&&(!out||e.status==='in'))out={live:e.status==='in',id:e.id,sp:sp,txt:tn(f)+' '+f.score+', '+tn(o)+' '+o.score,det:e.status==='in'?e.summary:'Final'}}})});return out}).catch(function(){return null})}
function getLive(){return Promise.all([one('basketball','mens-college-basketball'),one('football','college-football')]).then(function(a){a=a.filter(Boolean).sort(function(x,y){return(y.live?1:0)-(x.live?1:0)});return a[0]||null})}
function mk(){var a=document.createElement('a');a.className='gbm-ls';a.href='https://www.espn.com/'+(LS.sp==='basketball'?'mens-college-basketball':'college-football')+'/game/_/gameId/'+LS.id;a.target='_blank';a.rel='noopener';var em=document.createElement('em');em.textContent=LS.live?'Live':'Final';a.appendChild(em);a.appendChild(document.createTextNode(LS.txt+' - '+LS.det));return a}
function paint(){document.querySelectorAll('.sh-run').forEach(function(run){run.querySelectorAll('a.gbm-ls').forEach(function(x){x.remove()});if(!LS)return;var k=run.children,n=k.length;if(n>1&&n%2===0){run.insertBefore(mk(),k[n/2]);run.insertBefore(mk(),k[0])}else run.insertBefore(mk(),k[0])})}
function tick(){getLive().then(function(r){LS=r;paint()})}
tick();setInterval(tick,30000);setInterval(function(){if(LS&&!document.querySelector('.sh-run a.gbm-ls'))paint()},4000);
})();</script>
