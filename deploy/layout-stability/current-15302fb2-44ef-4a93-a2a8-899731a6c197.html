
<style id="gbm-mobile-post-top-gap-v1">
@media(max-width:820px){
html:has([data-hook="post-page"]) #SITE_PAGES_TRANSITION_GROUP,
html:has([data-hook="post-page"]) #SITE_PAGES,
html:has([data-hook="post-page"]) #PAGES_CONTAINER{
margin-top:0!important;
padding-top:0!important;
}
html:has([data-hook="post-page"]) [data-hook="post-page"]{
margin-top:0!important;
padding-top:0!important;
}
html:has([data-hook="post-page"]) ins.adsbygoogle[data-ad-status="unfilled"]{
display:none!important;
height:0!important;
min-height:0!important;
margin:0!important;
padding:0!important;
}
html:has([data-hook="post-page"]) *:has(> ins.adsbygoogle[data-ad-status="unfilled"]){
min-height:0!important;
height:auto!important;
margin-top:0!important;
margin-bottom:0!important;
padding-top:0!important;
padding-bottom:0!important;
}
}
</style>
<style id="gbm-footer-gap-guard-v3">
html.gbm-tight-footer #SITE_PAGES_TRANSITION_GROUP,
html.gbm-tight-footer #SITE_PAGES_TRANSITION_GROUP>div,
html.gbm-tight-footer #SITE_PAGES_TRANSITION_GROUP>div>.wixui-page,
html.gbm-tight-footer #SITE_PAGES,
html.gbm-tight-footer #PAGES_CONTAINER{
height:auto!important;min-height:0!important;padding-bottom:0!important;margin-bottom:0!important
}
html.gbm-tight-footer #SITE_FOOTER{margin-top:0!important}
html:has([data-hook="post-page"]) [data-hook="post-content"],
html:has([data-hook="post-page"]) article[data-hook="post"]{margin-bottom:0!important;padding-bottom:0!important}
html:has([data-hook="post-page"]) [data-hook="post-footer"]{margin-top:0!important}

</style>
<script>(function(){
if(window.__GBM_GAP_GUARD_V3__)return;window.__GBM_GAP_GUARD_V3__=1;
function p(){return(location.pathname||'').replace(/\/+$/,'')}
function clean(){
 var x=p(),exclude=x===''||x==='/'||/^\/account(?:\/|$)/.test(x)||/^\/(?:login|sign-in|signin)(?:\/|$)/.test(x)||/^\/_/.test(x);
 document.documentElement.classList.toggle('gbm-tight-footer',!exclude);
 if(x.indexOf('/post/')!==0)return;

}
function run(){clean();setTimeout(clean,180);setTimeout(clean,700)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
window.addEventListener('popstate',run);window.addEventListener('gbmroutechange',run);
})();</script>
