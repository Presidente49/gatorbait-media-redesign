name: Deploy GatorBait Flagship Preview

on:
  push:
    branches:
      - main
    paths:
      - "flagship/**"
      - ".github/workflows/deploy-flagship-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gatorbait-flagship-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload flagship site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./flagship

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
