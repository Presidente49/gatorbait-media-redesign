# Automatic publication belongs to the existing main-branch Pages publisher.
# Manual recovery only: never race a second push-triggered deployment.
# Preserve the repository-root sitemap host and all existing preview paths.
name: Deploy GatorBait Static Pages — Manual Recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gatorbait-flagship-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload complete static site including sitemaps and previews
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
