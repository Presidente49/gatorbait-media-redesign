    <h1 data-hook="post-title">Hey Missouri, Don't Show Me Anymore!</h1>
    <div><div><a data-hook="profile-link" href="/profile/buddymartinshow/profile"><span data-hook="user-name">Buddy Martin</span></a><span data-hook="time-ago">Oct 3</span><span data-hook="time-to-read">4 min read</span></div><button data-hook="more-button" aria-label="More"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="4" r="2"/><circle cx="10" cy="10" r="2"/><circle cx="10" cy="16" r="2"/></svg></button></div>
  </div></header>
  <div data-hook="post-description">
    <div data-hook="rcv-block-first"></div>
    <div data-breakout="normal"><p id="viewer-a1"><span>COLUMBIA, Mo. — The Show-Me State showed Florida plenty on Saturday, and none of it was pretty: 35 straight points after a 10-10 tie, and a 45-17 final that nobody in orange and blue saw coming.</span></p></div>
    <div data-breakout="normal"><p id="viewer-a2"><span>Jamal Roberts ran for 211 yards and three touchdowns. The Gators ran for 42. That is the game in two numbers, and it is the one Jon Sumrall will be staring at all week.</span></p></div>
    <div data-breakout="normal"><p id="viewer-a3"><span>I have watched Florida teams lose in this building before. I have not watched one get pushed around quite like this, at the line of scrimmage, on both sides, for three straight quarters.</span></p></div>
    <div data-breakout="normal"><h2 id="viewer-h1"><span>What went wrong up front</span></h2></div>
    <div data-breakout="normal"><p id="viewer-a4"><span>The offensive line that looked so sure of itself against Ole Miss never found a push. Aaron Philo was hurried on the first series and never really settled into the pocket after that.</span></p></div>
    <div data-breakout="normal"><p id="viewer-a5"><span>Defensively, the tackling that carried this team through September went missing. Missouri found the edges early and kept going back to them, because Florida never took them away.</span></p></div>
    <div data-breakout="normal"><figure data-hook="figure-IMAGE"><div data-hook="image-viewer"></div><figcaption>Missouri's Jamal Roberts breaks into the open field. Photo: Chris Spears, GatorBait Media</figcaption></figure></div>
    <div data-breakout="normal"><p id="viewer-a6"><span>None of this is fatal. Florida is 4-1 with South Carolina coming to the Swamp, and a team that answered every question in September now has a fresh one to answer in October.</span></p></div>
    <div data-breakout="normal"><blockquote><p><span>"We earned the loss. Every bit of it."</span></p></blockquote></div>
    <div data-breakout="normal"><h2 id="viewer-h2"><span>By the numbers</span></h2></div>
    <div data-breakout="normal"><p id="viewer-s1"><span><strong>211</strong> rushing yards for Missouri's Jamal Roberts, with three touchdowns.</span></p></div>
    <div data-breakout="normal"><p id="viewer-s2"><span><strong>35-0</strong> Missouri run after a 10-10 tie in the second quarter.</span></p></div>
    <div data-breakout="normal"><p id="viewer-s3"><span><strong>42</strong> rushing yards for Florida, a season low.</span></p></div>
    <div data-breakout="normal"><p id="viewer-a7"><span>The Gators will be back in Gainesville on Saturday. The question is which team shows up: the one that ran Ole Miss out of the Swamp, or the one that could not get off the field in Columbia.</span></p></div>
    <div data-breakout="normal"><p id="viewer-a8"><span>I know which one I expect. I also know this team has a way of surprising you, and I would not count it out after one bad afternoon in Missouri.</span></p></div>
  </div>
  <footer data-hook="post-footer"><span>Tags: Florida Gators, Missouri</span></footer>
