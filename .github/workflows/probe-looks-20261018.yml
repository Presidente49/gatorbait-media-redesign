name: Looks audit probe (read-only)
on:
  push:
    branches:
      - 'probe/looks-audit-20261018'
    paths:
      - 'probe-looks/**'
      - '.github/workflows/probe-looks-20261018.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit live pages for competing design layers
        run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp ../probe-looks/* . && node run.js
