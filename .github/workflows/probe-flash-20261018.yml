name: Flash audit probe (read-only)
on:
  push:
    branches:
      - 'probe/flash-20261018'
    paths:
      - 'probe-flash/**'
      - '.github/workflows/probe-flash-20261018.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit live pages for competing design layers
        run: |
          mkdir p && cd p && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cp ../probe-flash/* . && node run.js
      - name: Commit bottom screenshots (read-only probe output only)
        if: always()
        run: |
          mkdir -p deploy/mag-bottom-check-20261018 && mkdir -p deploy/flash-audit-after4-20261018 && cp p/shots/*.jpg p/shots/audit.json deploy/flash-audit-after4-20261018/ || true
          git config user.name "probe-bot" && git config user.email "probe-bot@users.noreply.github.com"
          git add deploy/flash-audit-after4-20261018 && git commit -m "probe output: magazine bottom check screenshots" && git push origin HEAD:probe/flash-20261018 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mag-live-20261018
          path: p/shots
          retention-days: 7
