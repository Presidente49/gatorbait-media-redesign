name: Article template local security checks

on:
  pull_request:
    paths:
      - 'deploy/post-template/dropcap/**'
      - '.github/workflows/article-template-security.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/post-template/dropcap/**'
      - '.github/workflows/article-template-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the free local package runner
        run: python -m pip install --index-url https://pypi.org/simple uv==0.12.17
      - name: Check delayed Ricos rendering regressions
        run: node --test deploy/post-template/dropcap/regression.test.mjs
      - name: Check template syntax and run local SAST
        run: python deploy/post-template/dropcap/security-check.py --output-dir /tmp/article-template-security
      - name: Save security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-template-security
          path: /tmp/article-template-security/
          if-no-files-found: error
          retention-days: 14
