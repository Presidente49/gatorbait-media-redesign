<style id="gbm-football-tools-style">
.gbm-football-tools{box-sizing:border-box;background:#10264b;color:#fffaf0;border-top:4px solid #f15a24;padding:20px;margin:0 0 26px;font-family:Barlow,Arial,sans-serif}
.gbm-football-tools *{box-sizing:border-box}
.gbm-football-tools small{display:block;color:#ff986c;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.gbm-football-tools h2,.mz .mz-ed .gbm-football-tools h2{color:#fffaf0!important;font:800 27px/1.05 Barlow,Arial,sans-serif!important;letter-spacing:-.025em!important;margin:9px 0 10px!important}
.gbm-football-tools p{color:#d8e0ed!important;font:14px/1.45 Barlow,Arial,sans-serif!important;margin:0 0 16px!important}
.gbm-football-tools nav{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gbm-football-tools a{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:10px 12px;color:#fffaf0!important;text-decoration:none!important;border:1px solid #7283a0;font-size:13px;font-weight:700;line-height:1.3}
.gbm-football-tools a:focus-visible{outline:3px solid #ff986c;outline-offset:3px}
.gbm-football-tools a:hover{background:#1c3762}
.mz-ed>.gbm-football-tools{margin-top:26px;margin-bottom:0}
.gbm-football-guide [data-hook="table-plugin-cell"]>div:last-child{padding:0!important}
#roster,#schedule{scroll-margin-top:100px}
.gbm-football-guide [data-hook="table-component"]{width:100%!important;max-width:100%!important;table-layout:fixed!important}
.gbm-football-guide [data-hook="table-component"] col{min-width:0!important}
.gbm-football-guide [data-hook="table-component"] col:nth-child(1){width:15%!important}
.gbm-football-guide [data-hook="table-component"] col:nth-child(2){width:60%!important}
.gbm-football-guide [data-hook="table-component"] col:nth-child(3){width:25%!important}
.gbm-football-guide [aria-label="2026 Florida football schedule and results"] col:nth-child(2){width:37%!important}
.gbm-football-guide [aria-label="2026 Florida football schedule and results"] col:nth-child(3){width:48%!important}
.gbm-football-guide [data-hook="table-plugin-cell"]{padding:12px!important;vertical-align:top}
html.gbm-football-guide #SITE_CONTAINER [data-hook="table-component"] [data-hook="table-plugin-cell"] p{padding:0!important;margin:0!important;font-size:16px!important;line-height:1.4!important;overflow-wrap:anywhere}
@media(max-width:480px){.gbm-football-tools{padding:17px}.gbm-football-tools h2,.mz .mz-ed .gbm-football-tools h2{font-size:25px!important}}
</style>
<script id="gbm-football-tools-runtime">
(function(){
  if(window.__GBM_FOOTBALL_TOOLS__)return;
  window.__GBM_FOOTBALL_TOOLS__=true;
  var guide='/post/florida-gators-2026-roster-and-schedule-update-auburn-opens-sec-play';
  var observer,timer,frame;
  function card(){
    var box=document.createElement('section');
    box.className='gbm-football-tools';
    box.setAttribute('aria-label','Florida football roster and schedule');
    box.innerHTML='<small>2026 Florida football</small><h2>Know the Gators.</h2><p>The players. The dates. The season in one place.</p><nav aria-label="Football team guide"><a href="'+guide+'#roster">Team roster <span aria-hidden="true">↗</span></a><a href="'+guide+'#schedule">Schedule &amp; results <span aria-hidden="true">↗</span></a></nav>';
    return box;
  }
  function mount(){
    var path=location.pathname.replace(/\/$/,'')||'/';
    document.documentElement.classList.toggle('gbm-football-guide',path===guide);
    if(path==='/'){
      var latest=document.querySelector('.sh-latest');
      if(latest&&!latest.querySelector('.gbm-football-tools'))latest.insertBefore(card(),latest.firstChild);
    }else if(path==='/magazine'){
      var edition=document.querySelector('#gbm-magazine-page .mz-ed');
      if(edition&&!edition.querySelector('.gbm-football-tools'))edition.appendChild(card());
    }else if(path===guide){
      var headings=document.querySelectorAll('h2,h3'),changed=false;
      headings.forEach(function(h){
        var text=h.textContent.trim().toLowerCase();
        if(text==='2026 player roster'&&h.id!=='roster'){h.id='roster';changed=true;}
        if(text==='2026 schedule & results'&&h.id!=='schedule'){h.id='schedule';changed=true;}
      });
      if(changed)jump();
    }
  }
  function jump(){
    if(location.pathname.replace(/\/$/,'')!==guide)return;
    var id=location.hash.slice(1);
    if(id!=='roster'&&id!=='schedule')return;
    var target=document.getElementById(id);
    if(target)target.scrollIntoView({block:'start'});
  }
  function sync(){
    if(observer)observer.disconnect();
    clearTimeout(timer);
    cancelAnimationFrame(frame);
    var path=location.pathname.replace(/\/$/,'')||'/';
    document.documentElement.classList.toggle('gbm-football-guide',path===guide);
    if(path!=='/'&&path!=='/magazine'&&path!==guide)return;
    mount();jump();
    if(!document.body)return;
    observer=new MutationObserver(function(){
      cancelAnimationFrame(frame);
      frame=requestAnimationFrame(mount);
    });
    observer.observe(document.body,{childList:true,subtree:true});
    timer=setTimeout(function(){observer.disconnect();mount()},15000);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',sync,{once:true});else sync();
  window.addEventListener('gbmroutechange',sync);
  window.addEventListener('popstate',sync);
  window.addEventListener('hashchange',function(){mount();jump()});
})();
</script>
